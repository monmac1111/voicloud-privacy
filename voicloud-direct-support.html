.topic-body{padding:14px 16px 16px;background:#fff}

<script>
(function() {
  var LANGS = ["ja", "en", "de", "es", "fr", "ko", "zh-Hans"];
  var LABELS = {"ja": "日本語", "en": "English", "de": "Deutsch", "es": "Español", "fr": "Français", "ko": "한국어", "zh-Hans": "中文"};
  var i18n = {
    "ja": {"title": "Voicloud Direct — ヘルプ / サポート", "heading": "ヘルプ / サポート", "tagline": "よくある質問とトラブルシューティング", "topics": "<details id=\"flow\"><summary>基本的な使い方</summary><div class=\"topic-body\"><p>iPhone をロックしたまま録音でき、止めるだけで音声も文字起こしも自分のクラウドに届きます。</p>\n<p>はじめに（1 回だけ）<br>1. アプリの 設定 →「クラウド同期」で、保存先のクラウドにサインインします（iCloud Drive はサインイン不要）。<br>2. アクションボタンに Voicloud Direct の録音を割り当てます（iPhone 15 Pro 以降。手順は下の「Action Button と Live Activity」）。コントロールセンターやロック画面にも同じコントロールを置けます。<br>3. 文字起こしまで自動にするには、設定 →「AI 文字起こし (BYOK)」に API キーを入れ、設定 →「自動処理」で「止めたら自動で文字起こし」をオンにします。</p>\n<p>ふだんの使い方<br>1. ロック画面のまま、アクションボタンを押して録音を始めます。ロック画面と Dynamic Island に経過時間が出ます。<br>2. もう一度押して止めます。<br>3. 録音は、接続済みのクラウドへ自動でアップロードされます。自動の文字起こしをオンにしていれば、文字起こし（と要約）の .md も同じクラウドに届きます。アプリを開く必要はありません。</p>\n<p>アプリを開いて、ホーム画面の録音ボタンから録ることもできます。録音をタップすると詳細画面が開き、再生・文字起こし・要約・「AI に送る」が使えます。</p></div></details>\n<details id=\"microphone\"><summary>Bluetooth / AirPods のマイクで録る</summary><div class=\"topic-body\"><p>設定 → 録音 → マイク で選びます。</p>\n<p>・自動（Bluetooth 優先）: 接続中の Bluetooth マイクを使います。<br>・iPhone のマイク: 常に本体のマイクを使います。</p>\n<p>録音画面には、いま使われているマイクが表示されます。</p>\n<p>⚠️ Bluetooth のマイクは通話用の回線を使うため、本体マイクより音質が下がり、文字起こしの精度にも影響することがあります。音質を優先するなら「iPhone のマイク」を選んでください。</p>\n<p>録音中に Bluetooth が切断されても、自動的に iPhone のマイクに切り替えて録音を続けます（1 つのファイルとして保存されます）。録音中に接続した場合も同じように切り替わります。</p>\n<p>以前から使っている場合、更新で音質が黙って変わらないよう、既存の録音があるときの初期値は「iPhone のマイク」です。</p></div></details>\n<details id=\"cloud\"><summary>クラウドに接続する</summary><div class=\"topic-body\"><p>対応クラウド: iCloud Drive / Google Drive / Dropbox / OneDrive / Box の 5 つ。</p>\n<p>・設定 → クラウド同期 から接続したいサービスをタップしてサインインします。<br>・接続済みのクラウド全部に、録音時に自動でアップロードされます（新しい録音は、同じ名前のファイルがあれば番号を進めて送ります。送り直しは同じ名前に上書きし、履歴は各サービス側で保持）。<br>・iCloud Drive はサインイン不要。OS 側で iCloud Drive が有効なら自動的に使えます。アプリ内で「切断」したい場合はクラウド同期セクションでオフにできます。<br>・録音した後にクラウドを追加した場合は、詳細画面の「クラウド同期」セクションに「同期」ボタンが出るので、それで後追いアップロードできます。<br>・全クラウドに同期済みでも、強制再アップロードしたい時は「再アップロード」ボタンが使えます（クラウド側に新リビジョンが積まれます）。</p></div></details>\n<details id=\"ai_send\"><summary>音声を AI に送る（Share Sheet）</summary><div class=\"topic-body\"><p>詳細画面の「AI に送る」をタップすると、iOS の共有シートが開きます。</p>\n<p>NotebookLM がインストールされていれば、そのまま音声ファイルを取り込めます。Gemini や ChatGPT は音声ファイルを共有受けしないことがあるので、その場合は Files アプリ経由でクラウドのフォルダを参照する形がおすすめです（自動同期されているので、同じファイルがすぐ見つかります）。</p>\n<p>ヒント: 共有シートで「編集」→ NotebookLM を「よく使う項目」に追加すると、毎回トップに出るようになります。</p></div></details>\n<details id=\"byok\"><summary>BYOK 文字起こし（API キーで使う）</summary><div class=\"topic-body\"><p>自分で取得した API キーで、アプリ内で直接文字起こしできます。</p>\n<p>対応プロバイダ:<br>・OpenAI（whisper-1 / gpt-4o-transcribe など。話者分離は非対応）<br>・Gemini AI Studio（無料枠あり、話者分離対応）<br>・Vertex AI（Google Cloud のサービスアカウント、話者分離対応）</p>\n<p>設定 → AI 文字起こし からプロバイダを選び、API キーを貼り付けます。キーは端末の Keychain に暗号化保存され、Voicloud Direct のサーバーには送信されません（そもそもサーバーがありません）。</p>\n<p>話者分離が必要な場合は Gemini 系を選んでください。OpenAI は文字起こしの正確さに優れますが話者ラベルは出ません。</p></div></details>\n<details id=\"auto\"><summary>止めたら自動で文字起こし・要約</summary><div class=\"topic-body\"><p>設定 → 自動処理 で「止めたら自動で文字起こし」をオンにすると、録音を止めたあと、アプリを開かなくても文字起こしを作り、.md をクラウドに送ります。「続けて要約も作る」もオンにすると、要約の .md も送ります。</p>\n<p>ロック画面から始めて止めた録音でも動きます。AI への通信とクラウドへの送信は iOS が引き受けて続けるので、アプリを閉じたままで大丈夫です。いつ進むかは iOS が決めます。ふつうは数分で届きますが、電池や回線の具合によってはもっとかかります。</p>\n<p>「Wi‑Fi のときだけ送る」をオンにすると、モバイル回線の間は送信と AI の処理を待ち、Wi‑Fi に戻ると続けます。</p>\n<p>使うには、AI 文字起こしの API キーと、外部 AI へ送ることへの同意が必要です。</p></div></details>\n<details id=\"summary\"><summary>要約と要約プロンプト</summary><div class=\"topic-body\"><p>文字起こし済みの録音は、同じプロバイダで要約も生成できます。</p>\n<p>設定 → 要約プロンプト で、要約のスタイルをプリセットから選ぶか、自由記述に編集できます（標準 / 会議議事録 / 雑談 / インタビュー / メモ）。</p>\n<p>OpenAI は文字起こしと要約でモデル系統が完全に別なので、要約用モデルを別途指定する欄があります（例: gpt-4o-mini や gpt-5）。</p>\n<p>Pro / reasoning 系（例: o3-pro / gpt-5.5-pro）は推論時間が長くなる代わりに品質が上がります。</p></div></details>\n<details id=\"diarization\"><summary>話者分離のコツ</summary><div class=\"topic-body\"><p>Gemini 系での話者分離は、声質の似た同性同年代の話者で取り違えやすい弱点があります。</p>\n<p>対策:<br>・詳細画面の「話者数」を 自動 ではなく実際の人数（例: 4 人）に設定すると、ちょうどその人数で分けるよう強制できます。<br>・取り違えに気付いたら、設定 → 文字起こしプロンプト で独自の手がかりを追加できます（口癖、訛り、立場など）。<br>・文字起こしモデルを Pro 系（gemini-2.5-pro 等）にすると、Flash より細かい音声特徴を扱えるため精度が上がる傾向があります（ただし時間 3〜5 倍）。</p>\n<p>OpenAI Whisper / gpt-4o-transcribe では話者分離自体ができません。話者ラベルが必要なら Gemini / Vertex を選んでください。</p></div></details>\n<details id=\"playback\"><summary>再生・シーク・速度</summary><div class=\"topic-body\"><p>・波形をタップ または ドラッグすると、その位置に移動して再生できます。<br>・再生速度は左の「1x」タップで 1x → 1.5x → 2x → 0.5x の順に切り替わります。<br>・10 秒戻る / 進むボタンも併用できます。<br>・文字起こしや要約をスクロールしている間も、波形と再生時刻は画面上部にピン留めされたままです。</p></div></details>\n<details id=\"edit\"><summary>切り取る・無音にする・元に戻す</summary><div class=\"topic-body\"><p>詳細画面の「トリミング」から、録音の一部を切り取ったり、無音にしたりできます。</p>\n<p>・切り取る: 選んだ範囲だけを残します。<br>・無音にする: 選んだ範囲の音を消します。録音の長さは変わりません。文字起こしのその部分も消し、要約があれば作り直します。<br>・範囲は両端の黄色い取っ手で選びます。枠の上のつまみを動かすと、長さを変えずに枠ごと動かせます（「長さ」の下の −1s / +1s でも動かせます）。<br>・編集の画面を開いている間は、その録音をクラウドに送りません。閉じると自動で再開します。編集したときは、編集後の音声を送り直します。<br>・編集前の音声は 3 日間、端末に保管され、詳細画面の「編集を元に戻す」で戻せます（直近 3 回分）。文字起こしと要約も戻り、クラウドにも元の音声を送り直します。<br>・すぐに消したいときは「編集前の音声を今すぐ消す」を使います。消すと元に戻せません。<br>・編集前の音声は端末の中だけに置き、クラウドには送りません。ただし、編集の前に送信が終わっていた音声は、クラウド側の変更履歴に残ることがあります。</p></div></details>\n<details id=\"action_button\"><summary>Action Button と Live Activity（iPhone 15 Pro 以降）</summary><div class=\"topic-body\"><p>iPhone 15 Pro 以降では、本体側面のアクションボタンで録音を始められます。設定 → アクションボタン → コントロール で「Voicloud Direct Recording」を選ぶと、ボタンを押すだけで録音の開始・停止ができます。iPhone がロック中でも録音を始められます。</p>\n<p>録音中は Dynamic Island とロック画面に赤いバッジが出て、現在の経過時間が見えます。</p>\n<p>ロック中に始めた録音は、途中でマイクが替わる（AirPods がほかの端末に移るなど）と、そこまでを保存して止まります。</p>\n<p>Siri ショートカットからも「録音をトグル」「録音を開始」「録音を停止」が使えます。</p></div></details>\n<details id=\"calendar_location\"><summary>カレンダー連動・位置情報</summary><div class=\"topic-body\"><p>・設定 → 録音 でカレンダー連動をオンにすると、録音開始時にカレンダーで進行中の予定があれば、その予定名がファイル名に反映されます。<br>・位置情報をオンにすると、録音にメタデータとして座標と住所が保存されます（録音音声には埋め込まれません）。<br>・「.md に場所を書く」をオンにすると、クラウドに送る文字起こし・要約の .md の先頭に録音日時と場所が入ります（既定はオフ。オフなら場所は端末の外に出ません）。<br>・どちらも任意。OFF でも全機能は使えます。</p></div></details>\n<details id=\"background\"><summary>バックグラウンド動作について</summary><div class=\"topic-body\"><p>・録音は、画面ロックや別アプリに切り替えた状態でも継続します（音声バックグラウンドモード）。<br>・手で実行した文字起こし / 要約の API 呼び出しは、最大数分間はバックグラウンドでも生きていますが、長時間（特に Pro reasoning）は前面に置いておくのが安全です。<br>・クラウドアップロードが途中で止まった場合は、iOS が空いたタイミングで自動的にリトライします。</p></div></details>\n<details id=\"privacy\"><summary>プライバシーとデータの扱い</summary><div class=\"topic-body\"><p>・録音音声は端末内と、あなたが選んだクラウドにのみ保存されます。<br>・API キー / サービスアカウント JSON は端末の Keychain に暗号化保存され、Voicloud Direct のサーバー（存在しません）には一切送信されません。<br>・文字起こし / 要約は、あなたが選んだ AI プロバイダ（OpenAI / Google / Vertex）のサーバーに直接送信されます。各社のデータポリシーが適用されます。<br>・解析・広告・トラッキングは一切行いません。</p></div></details>\n<details id=\"troubleshooting\"><summary>うまくいかないとき</summary><div class=\"topic-body\"><p>文字起こしがおかしい / 途中で止まる:<br>・OpenAI Whisper-1 は無音区間に「【早送り中】」を挿入する有名な癖があります。gpt-4o-transcribe に切り替えると改善します。<br>・Gemini 系で時刻が不正確: 設定 → 文字起こしプロンプトを編集していなければ、最新版に戻す（プリセット「標準」）。</p>\n<p>クラウドにアップロードされない:<br>・設定でそのクラウドが「接続中」になっているか確認。<br>・OAuth トークンが切れていることがあるので、一度切断 → 再接続。</p>\n<p>Action Button が反応しない:<br>・iOS 設定 → アクションボタン → コントロール で「Voicloud Direct Recording」を選択しているか確認。<br>・初回はマイク権限を許可する必要があります。iOS 設定 → Voicloud Direct で「ライブアクティビティ」もオンにしてください。<br>・ロック中に押して録音が始まらなかったときは、もう一度押してください。</p>\n<p>それでも解決しない場合は、下の「お問い合わせ」からご連絡ください。</p></div></details>", "relatedLinks": "関連リンク", "privacyLink": "プライバシーポリシー", "contact": "<div class=\"contact-box\"><h3>お問い合わせ</h3><p>不具合・機能リクエスト・ご質問はメールでどうぞ。平日 1-3 営業日以内に返信します。</p><p><a href=\"mailto:monma.free@gmail.com\">monma.free@gmail.com</a></p></div>"},
    "en": {"title": "Voicloud Direct — Help / Support", "heading": "Help / Support", "tagline": "Frequently Asked Questions and Troubleshooting", "topics": "<details id=\"flow\"><summary>Basic Usage</summary><div class=\"topic-body\"><p>You can record with your iPhone still locked. When you stop, the audio and the transcript are delivered to your own cloud.</p>\n<p>Set up once<br>1. In the app, go to Settings → “Cloud Sync” and sign in to the cloud you want to save to (iCloud Drive needs no sign-in).<br>2. Assign Voicloud Direct recording to the Action Button (iPhone 15 Pro and later; see “Action Button and Live Activity” below). You can also add the same control to Control Center or the Lock Screen.<br>3. To make transcription automatic too, enter an API key in Settings → “AI Transcription (BYOK)”, then turn on “Transcribe automatically when stopped” in Settings → “Automation”.</p>\n<p>Everyday use<br>1. With the iPhone locked, press the Action Button to start recording. The Lock Screen and Dynamic Island show the elapsed time.<br>2. Press it again to stop.<br>3. The recording uploads automatically to your connected clouds. If automatic transcription is on, the transcript (and summary) .md files arrive in the same cloud. You don't need to open the app.</p>\n<p>You can also open the app and record with the record button on the home screen. Tap a recording to open its detail screen for playback, transcription, summary, and “Send to AI”.</p></div></details>\n<details id=\"microphone\"><summary>Recording with a Bluetooth / AirPods mic</summary><div class=\"topic-body\"><p>Choose it in Settings → Recording → Microphone.</p>\n<p>• Automatic (prefer Bluetooth): uses the connected Bluetooth microphone.<br>• iPhone Microphone: always uses the built-in microphone.</p>\n<p>The recording screen shows which microphone is currently in use.</p>\n<p>⚠️ Bluetooth microphones use a call-quality link, so the audio is lower quality than the built-in mic and transcription accuracy may suffer. Choose “iPhone Microphone” when quality matters most.</p>\n<p>If Bluetooth disconnects mid-recording, the app switches to the iPhone microphone and keeps recording (everything is saved as a single file). Connecting a headset mid-recording switches over the same way.</p>\n<p>If you already had recordings before this update, the default is “iPhone Microphone”, so an update never silently changes how your recordings sound.</p></div></details>\n<details id=\"cloud\"><summary>Connect to Cloud</summary><div class=\"topic-body\"><p>Five clouds are supported: iCloud Drive / Google Drive / Dropbox / OneDrive / Box.</p>\n<p>• In Settings → Cloud sync, tap the service you want to connect and sign in.<br>• Each recording is uploaded automatically to every connected cloud (a new recording gets the next number if a file with the same name already exists; re-uploads overwrite the same name, and each service keeps its own version history).<br>• iCloud Drive needs no sign-in — it works automatically when iCloud Drive is on in iOS. To “disconnect” it in the app, turn it off in the Cloud sync section.<br>• If you add a cloud after recording, a “Sync” button appears in the Cloud sync section of the details screen so you can upload afterwards.<br>• Even when every cloud is synced, you can force a new upload with the “Re-upload” button (a new revision is added on the cloud side).</p></div></details>\n<details id=\"ai_send\"><summary>Send audio to AI (Share Sheet)</summary><div class=\"topic-body\"><p>Tap “Send to AI” on the details screen to open the iOS share sheet.</p>\n<p>If NotebookLM is installed, it can import the audio file directly. Gemini and ChatGPT sometimes don't accept shared audio files; in that case, open the cloud folder through the Files app instead (it's synced automatically, so you'll find the same file right away).</p>\n<p>Tip: In the share sheet, tap “Edit” and add NotebookLM to Favorites so it always appears first.</p></div></details>\n<details id=\"byok\"><summary>BYOK Transcription (use with API Key)</summary><div class=\"topic-body\"><p>Transcribe directly in the app with an API key you obtain yourself.</p>\n<p>Supported providers:<br>• OpenAI (whisper-1 / gpt-4o-transcribe, etc. No speaker separation)<br>• Gemini AI Studio (free tier available, supports speaker separation)<br>• Vertex AI (Google Cloud service account, supports speaker separation)</p>\n<p>Choose a provider in Settings → AI transcription and paste your API key. The key is encrypted in your device's Keychain and never sent to a Voicloud Direct server (there isn't one).</p>\n<p>If you need speaker separation, choose a Gemini option. OpenAI is very accurate but doesn't output speaker labels.</p></div></details>\n<details id=\"auto\"><summary>Automatic transcripts and summaries</summary><div class=\"topic-body\"><p>Turn on \"Transcribe automatically when stopped\" in Settings → Automation, and when you stop a recording the app creates the transcript and uploads the .md to your cloud, without you opening the app. Also turn on \"Also create a summary\" to upload the summary .md too.</p>\n<p>This works for recordings started and stopped from the lock screen as well. iOS takes over the AI requests and cloud uploads, so the app can stay closed. iOS decides when the work runs. It usually arrives within a few minutes, but can take longer depending on battery and network.</p>\n<p>With \"Upload on Wi‑Fi only\" on, uploads and AI processing wait while you're on mobile data and continue once you're back on Wi‑Fi.</p>\n<p>You need an AI transcription API key and your consent to send data to an external AI.</p></div></details>\n<details id=\"summary\"><summary>Summary and Summary Prompt</summary><div class=\"topic-body\"><p>Once a recording is transcribed, you can also generate a summary with the same provider.</p>\n<p>In Settings → Summary prompt, pick a summary style from the presets or write your own (Standard / Meeting minutes / Casual conversation / Interview / Memo).</p>\n<p>OpenAI uses completely separate model families for transcription and summaries, so there is a separate field for the summary model (e.g. gpt-4o-mini or gpt-5).</p>\n<p>Pro / reasoning models (e.g. o3-pro / gpt-5.5-pro) take longer to think but produce better results.</p></div></details>\n<details id=\"diarization\"><summary>Tips for speaker diarization</summary><div class=\"topic-body\"><p>Gemini-based speaker separation tends to mix up people with similar voices, such as speakers of the same gender and age.</p>\n<p>What helps:<br>• Set “Speakers” on the details screen to the actual number (e.g. 4) instead of Auto to force exactly that many speakers.<br>• If you notice mix-ups, add your own cues in Settings → Transcription prompt (verbal habits, accents, roles and so on).<br>• A Pro transcription model (e.g. gemini-2.5-pro) handles finer voice features than Flash and tends to be more accurate (but takes 3–5× longer).</p>\n<p>OpenAI Whisper / gpt-4o-transcribe cannot separate speakers at all. Choose Gemini / Vertex if you need speaker labels.</p></div></details>\n<details id=\"playback\"><summary>Playback, Seek &amp; Speed</summary><div class=\"topic-body\"><p>• Tap or drag the waveform to jump to that point and play from there.<br>• Tap “1x” on the left to cycle playback speed: 1x → 1.5x → 2x → 0.5x.<br>• You can also use the 10-second back / forward buttons.<br>• While you scroll through the transcript or summary, the waveform and playback time stay pinned at the top of the screen.</p></div></details>\n<details id=\"edit\"><summary>Cut, Mute &amp; Undo</summary><div class=\"topic-body\"><p>From “Trim” on the detail screen, you can cut out part of a recording or mute part of it.</p>\n<p>• Cut: keeps only the range you select.<br>• Mute: silences the selected range. The length of the recording does not change. That part of the transcript is removed too, and the summary is rebuilt if there is one.<br>• Choose the range with the yellow handles at both ends. Drag the grip above the frame to move the whole range without changing its length (the −1s / +1s buttons under “Length” do the same).<br>• While the editing screen is open, that recording is not sent to the cloud. Sending resumes automatically when you close it. After an edit, the edited audio is sent again.<br>• The audio from before the edit is kept on the device for 3 days, and “Undo edit” on the detail screen brings it back (up to the last 3 edits). The transcript and summary come back too, and the original audio is sent to the cloud again.<br>• To remove it right away, use “Delete pre-edit audio now”. Once deleted, the edit can no longer be undone.<br>• The pre-edit audio stays on the device only and is never sent to the cloud. However, audio that had already been uploaded before the edit may remain in the cloud service’s version history.</p></div></details>\n<details id=\"action_button\"><summary>Action Button and Live Activity (iPhone 15 Pro and later)</summary><div class=\"topic-body\"><p>On iPhone 15 Pro and later, you can start recording with the Action Button on the side. In Settings &gt; Action Button &gt; Controls, choose \"Voicloud Direct Recording\". Then just press the button to start or stop recording. This works even while your iPhone is locked.</p>\n<p>While recording, a red badge appears in the Dynamic Island and on the Lock Screen, showing the elapsed time.</p>\n<p>If the microphone changes during a recording started while locked (for example, AirPods switching to another device), the recording is saved up to that point and stops.</p>\n<p>You can also use \"Toggle Recording\", \"Start Recording\" and \"Stop Recording\" from Siri Shortcuts.</p></div></details>\n<details id=\"calendar_location\"><summary>Calendar integration &amp; Location</summary><div class=\"topic-body\"><p>• Turn on calendar linking in Settings → Recording, and if an event is in progress when you start recording, its name becomes the file name.<br>• Turn on location, and the coordinates and address are saved as metadata with the recording (they are not embedded in the audio).<br>• Turn on “Write location in .md” to put the recording date and place at the top of the transcription / summary .md files sent to your cloud (off by default; when off, the location never leaves your device).<br>• Both are optional. Every feature works with them off.</p></div></details>\n<details id=\"background\"><summary>About background operation</summary><div class=\"topic-body\"><p>• Recording keeps going when the screen locks or you switch to another app (audio background mode).<br>• Transcription / summary API calls you start by hand stay alive in the background for up to a few minutes, but for long jobs (especially Pro reasoning models) it's safest to keep the app in the foreground.<br>• If a cloud upload stops partway, iOS retries it automatically when it has time.</p></div></details>\n<details id=\"privacy\"><summary>Privacy and Data Handling</summary><div class=\"topic-body\"><p>• Recordings are stored only on your device and in the clouds you choose.<br>• API keys / service account JSON are encrypted in your device's Keychain and never sent to a Voicloud Direct server (there isn't one).<br>• Transcription and summaries are sent directly to the AI provider you choose (OpenAI / Google / Vertex). Each provider's data policy applies.<br>• No analytics, ads or tracking of any kind.</p></div></details>\n<details id=\"troubleshooting\"><summary>When things aren't working</summary><div class=\"topic-body\"><p>Transcript looks wrong / stops partway:<br>• OpenAI Whisper-1 is known for inserting phrases such as “Thanks for watching” into silent sections. Switching to gpt-4o-transcribe fixes this.<br>• Timestamps are off with Gemini: unless you've customized Settings → Transcription prompt, reset it to the latest version (the “Standard” preset).</p>\n<p>Not uploading to the cloud:<br>• Check that the cloud shows as “Connected” in Settings.<br>• The OAuth token may have expired — disconnect and reconnect once.</p>\n<p>Action Button doesn't respond:<br>- Check that \"Voicloud Direct Recording\" is selected in iOS Settings &gt; Action Button &gt; Controls.<br>- The first time, you need to allow microphone access. Also keep “Live Activities” turned on in iOS Settings → Voicloud Direct.<br>- If recording doesn't start when you press it while locked, press it once more.</p>\n<p>If that doesn't help, contact us via “Contact” below.</p></div></details>", "relatedLinks": "Related Links", "privacyLink": "Privacy Policy", "contact": "<div class=\"contact-box\"><h3>Contact Us</h3><p>For bug reports, feature requests, or general questions, please reach out by email. We aim to respond within 1–3 business days.</p><p><a href=\"mailto:monma.free@gmail.com\">monma.free@gmail.com</a></p></div>"},
    "de": {"title": "Voicloud Direct — Hilfe / Support", "heading": "Hilfe / Support", "tagline": "Häufig gestellte Fragen und Fehlerbehebung", "topics": "<details id=\"flow\"><summary>Grundlegende Bedienung</summary><div class=\"topic-body\"><p>Sie können aufnehmen, während das iPhone gesperrt bleibt. Nach dem Stoppen landen Audio und Transkript in Ihrer eigenen Cloud.</p>\n<p>Einmalig einrichten<br>1. Öffnen Sie in der App Einstellungen → „Cloud-Synchronisierung“ und melden Sie sich bei der Cloud an, in der gespeichert werden soll (für iCloud Drive ist keine Anmeldung nötig).<br>2. Weisen Sie die Aufnahme von Voicloud Direct dem Action Button zu (iPhone 15 Pro und neuer; siehe „Action Button und Live Activity“ unten). Dasselbe Steuerelement lässt sich auch im Kontrollzentrum oder auf dem Sperrbildschirm ablegen.<br>3. Damit auch die Transkription automatisch läuft, tragen Sie unter Einstellungen → „KI-Transkription (BYOK)“ einen API-Schlüssel ein und aktivieren Sie unter Einstellungen → „Automatik“ die Option „Nach dem Stoppen automatisch transkribieren“.</p>\n<p>Im Alltag<br>1. Drücken Sie bei gesperrtem iPhone den Action Button, um die Aufnahme zu starten. Sperrbildschirm und Dynamic Island zeigen die Aufnahmedauer.<br>2. Drücken Sie erneut, um zu stoppen.<br>3. Die Aufnahme wird automatisch in Ihre verbundenen Clouds hochgeladen. Ist die automatische Transkription aktiviert, kommen auch die .md-Dateien mit Transkript (und Zusammenfassung) in derselben Cloud an. Die App muss dafür nicht geöffnet werden.</p>\n<p>Sie können auch die App öffnen und mit der Aufnahmetaste auf dem Startbildschirm aufnehmen. Tippen Sie auf eine Aufnahme, um die Detailansicht mit Wiedergabe, Transkription, Zusammenfassung und „An KI senden“ zu öffnen.</p></div></details>\n<details id=\"microphone\"><summary>Mit einem Bluetooth-/AirPods-Mikrofon aufnehmen</summary><div class=\"topic-body\"><p>Wählen Sie es unter Einstellungen → Aufnahme → Mikrofon.</p>\n<p>• Automatisch (Bluetooth bevorzugt): verwendet das verbundene Bluetooth-Mikrofon.<br>• iPhone-Mikrofon: verwendet immer das eingebaute Mikrofon.</p>\n<p>Der Aufnahmebildschirm zeigt an, welches Mikrofon gerade verwendet wird.</p>\n<p>⚠️ Bluetooth-Mikrofone nutzen eine Telefonieverbindung. Die Qualität ist daher geringer als beim eingebauten Mikrofon, und die Transkriptionsgenauigkeit kann leiden. Wählen Sie „iPhone-Mikrofon“, wenn die Qualität im Vordergrund steht.</p>\n<p>Bricht Bluetooth während der Aufnahme ab, wechselt die App zum iPhone-Mikrofon und nimmt weiter auf (alles wird als eine Datei gespeichert). Beim Verbinden während der Aufnahme wird genauso gewechselt.</p>\n<p>Hatten Sie schon vor diesem Update Aufnahmen, ist „iPhone-Mikrofon“ die Vorgabe – so verändert ein Update den Klang Ihrer Aufnahmen nie unbemerkt.</p></div></details>\n<details id=\"cloud\"><summary>Mit Cloud verbinden</summary><div class=\"topic-body\"><p>Fünf Clouds werden unterstützt: iCloud Drive / Google Drive / Dropbox / OneDrive / Box.</p>\n<p>• Tippen Sie unter Einstellungen → Cloud-Synchronisierung auf den gewünschten Dienst und melden Sie sich an.<br>• Jede Aufnahme wird automatisch in alle verbundenen Clouds hochgeladen (neue Aufnahmen erhalten die nächste Nummer, wenn es bereits eine gleichnamige Datei gibt; erneutes Hochladen überschreibt die gleichnamige Datei, der Verlauf bleibt beim jeweiligen Dienst).<br>• iCloud Drive braucht keine Anmeldung – es funktioniert automatisch, wenn iCloud Drive in iOS aktiv ist. Zum „Trennen“ in der App schalten Sie es im Bereich Cloud-Synchronisierung aus.<br>• Fügen Sie nach der Aufnahme eine Cloud hinzu, erscheint in der Detailansicht im Bereich Cloud-Synchronisierung eine Taste „Synchronisieren“ zum nachträglichen Hochladen.<br>• Auch wenn alles synchronisiert ist, können Sie mit „Erneut hochladen“ einen neuen Upload erzwingen (in der Cloud entsteht eine neue Revision).</p></div></details>\n<details id=\"ai_send\"><summary>Audio an KI senden (Share Sheet)</summary><div class=\"topic-body\"><p>Tippen Sie in der Detailansicht auf „An KI senden“, um das iOS-Teilen-Menü zu öffnen.</p>\n<p>Ist NotebookLM installiert, kann es die Audiodatei direkt übernehmen. Gemini und ChatGPT nehmen geteilte Audiodateien manchmal nicht an; öffnen Sie dann den Cloud-Ordner über die Dateien-App (er ist automatisch synchronisiert, Sie finden dieselbe Datei sofort).</p>\n<p>Tipp: Tippen Sie im Teilen-Menü auf „Bearbeiten“ und fügen Sie NotebookLM zu den Favoriten hinzu, damit es immer oben erscheint.</p></div></details>\n<details id=\"byok\"><summary>BYOK-Transkription (mit API Key verwenden)</summary><div class=\"topic-body\"><p>Transkribieren Sie direkt in der App mit einem API-Schlüssel, den Sie selbst beziehen.</p>\n<p>Unterstützte Anbieter:<br>• OpenAI (whisper-1 / gpt-4o-transcribe usw., keine Sprechertrennung)<br>• Gemini AI Studio (kostenloses Kontingent, mit Sprechertrennung)<br>• Vertex AI (Google-Cloud-Dienstkonto, mit Sprechertrennung)</p>\n<p>Wählen Sie unter Einstellungen → KI-Transkription einen Anbieter und fügen Sie Ihren API-Schlüssel ein. Der Schlüssel wird verschlüsselt im Schlüsselbund Ihres Geräts gespeichert und nie an einen Voicloud-Direct-Server gesendet (es gibt keinen).</p>\n<p>Für Sprechertrennung wählen Sie Gemini. OpenAI ist sehr genau, liefert aber keine Sprecherkennzeichnungen.</p></div></details>\n<details id=\"auto\"><summary>Automatische Transkripte und Zusammenfassungen</summary><div class=\"topic-body\"><p>Aktiviere unter Einstellungen → Automatik „Nach dem Stoppen automatisch transkribieren“. Wenn du eine Aufnahme beendest, erstellt die App das Transkript und lädt die .md in deine Cloud hoch, ohne dass du die App öffnen musst. Mit „Auch eine Zusammenfassung erstellen“ wird zusätzlich die Zusammenfassung als .md hochgeladen.</p>\n<p>Das funktioniert auch für Aufnahmen, die du auf dem Sperrbildschirm startest und beendest. iOS übernimmt die Anfragen an die KI und die Uploads, die App kann also geschlossen bleiben. Wann das passiert, entscheidet iOS. Meist ist alles nach wenigen Minuten da, je nach Akku und Netz kann es länger dauern.</p>\n<p>Mit „Nur über WLAN hochladen“ warten Uploads und KI-Verarbeitung im Mobilfunknetz und laufen weiter, sobald du wieder im WLAN bist.</p>\n<p>Du brauchst einen API-Schlüssel für die KI-Transkription und deine Zustimmung, Daten an eine externe KI zu senden.</p></div></details>\n<details id=\"summary\"><summary>Zusammenfassung und Zusammenfassungs-Prompt</summary><div class=\"topic-body\"><p>Für transkribierte Aufnahmen können Sie mit demselben Anbieter auch eine Zusammenfassung erstellen.</p>\n<p>Unter Einstellungen → Zusammenfassungs-Prompt wählen Sie einen Stil aus den Vorlagen oder schreiben einen eigenen (Standard / Besprechungsprotokoll / Lockeres Gespräch / Interview / Notiz).</p>\n<p>OpenAI verwendet für Transkription und Zusammenfassung völlig getrennte Modellfamilien, daher gibt es ein eigenes Feld für das Zusammenfassungsmodell (z. B. gpt-4o-mini oder gpt-5).</p>\n<p>Pro- / Reasoning-Modelle (z. B. o3-pro / gpt-5.5-pro) brauchen länger, liefern aber bessere Ergebnisse.</p></div></details>\n<details id=\"diarization\"><summary>Tipps zur Sprecher-Diarisierung</summary><div class=\"topic-body\"><p>Die Sprechertrennung mit Gemini verwechselt leicht Personen mit ähnlicher Stimme, etwa gleichen Geschlechts und Alters.</p>\n<p>Was hilft:<br>• Stellen Sie „Sprecher“ in der Detailansicht statt auf Automatisch auf die tatsächliche Anzahl (z. B. 4), um genau so viele Sprecher zu erzwingen.<br>• Wenn Ihnen Verwechslungen auffallen, ergänzen Sie unter Einstellungen → Transkriptions-Prompt eigene Hinweise (Sprechgewohnheiten, Akzent, Rolle usw.).<br>• Ein Pro-Modell (z. B. gemini-2.5-pro) erfasst feinere Stimmmerkmale als Flash und ist meist genauer (dauert aber 3- bis 5-mal länger).</p>\n<p>OpenAI Whisper / gpt-4o-transcribe können überhaupt keine Sprecher trennen. Wählen Sie Gemini / Vertex, wenn Sie Sprecherkennzeichnungen brauchen.</p></div></details>\n<details id=\"playback\"><summary>Wiedergabe · Suchen · Geschwindigkeit</summary><div class=\"topic-body\"><p>• Tippen oder ziehen Sie auf der Wellenform, um an diese Stelle zu springen und von dort abzuspielen.<br>• Tippen Sie links auf „1x“, um die Geschwindigkeit zu wechseln: 1x → 1.5x → 2x → 0.5x.<br>• Die Tasten für 10 Sekunden zurück / vor stehen ebenfalls zur Verfügung.<br>• Beim Scrollen durch Transkript oder Zusammenfassung bleiben Wellenform und Wiedergabezeit oben angeheftet.</p></div></details>\n<details id=\"edit\"><summary>Zuschneiden, Stummschalten &amp; Rückgängig</summary><div class=\"topic-body\"><p>Über „Trimmen“ auf dem Detailbildschirm können Sie einen Teil einer Aufnahme herausschneiden oder stummschalten.</p>\n<p>• Zuschneiden: Nur der ausgewählte Bereich bleibt erhalten.<br>• Stummschalten: Der ausgewählte Bereich wird stumm. Die Länge der Aufnahme ändert sich nicht. Der entsprechende Teil des Transkripts wird ebenfalls entfernt, und eine vorhandene Zusammenfassung wird neu erstellt.<br>• Wählen Sie den Bereich mit den gelben Griffen an beiden Enden. Ziehen Sie den Griff über dem Rahmen, um den ganzen Bereich zu verschieben, ohne seine Länge zu ändern (die Tasten −1s / +1s unter „Länge“ tun dasselbe).<br>• Solange der Bearbeitungsbildschirm geöffnet ist, wird diese Aufnahme nicht in die Cloud gesendet. Nach dem Schließen wird das Senden automatisch fortgesetzt. Nach einer Bearbeitung wird die bearbeitete Aufnahme erneut gesendet.<br>• Die Aufnahme vor der Bearbeitung bleibt 3 Tage auf dem Gerät, und mit „Bearbeitung rückgängig machen“ auf dem Detailbildschirm stellen Sie sie wieder her (bis zu den letzten 3 Bearbeitungen). Transkript und Zusammenfassung werden ebenfalls wiederhergestellt, und die ursprüngliche Aufnahme wird erneut in die Cloud gesendet.<br>• Zum sofortigen Entfernen verwenden Sie „Originalaufnahme jetzt löschen“. Danach lässt sich die Bearbeitung nicht mehr rückgängig machen.<br>• Die Aufnahme vor der Bearbeitung bleibt nur auf dem Gerät und wird nie in die Cloud gesendet. Eine Aufnahme, die schon vor der Bearbeitung hochgeladen war, kann jedoch im Versionsverlauf des Cloud-Dienstes verbleiben.</p></div></details>\n<details id=\"action_button\"><summary>Action Button und Live Activity (iPhone 15 Pro und neuer)</summary><div class=\"topic-body\"><p>Auf dem iPhone 15 Pro und neuer kannst du die Aufnahme mit der Aktionstaste an der Seite starten. Wähle unter Einstellungen &gt; Aktionstaste &gt; Steuerelemente „Voicloud Direct Recording“. Dann startest und stoppst du die Aufnahme einfach per Tastendruck – auch wenn dein iPhone gesperrt ist.</p>\n<p>Während der Aufnahme erscheint in der Dynamic Island und auf dem Sperrbildschirm ein rotes Symbol mit der bisherigen Dauer.</p>\n<p>Wechselt bei einer im gesperrten Zustand gestarteten Aufnahme das Mikrofon (z. B. wenn die AirPods zu einem anderen Gerät wechseln), wird die Aufnahme bis dahin gespeichert und beendet.</p>\n<p>Über Siri-Kurzbefehle kannst du außerdem „Aufnahme umschalten“, „Aufnahme starten“ und „Aufnahme stoppen“ verwenden.</p></div></details>\n<details id=\"calendar_location\"><summary>Kalenderintegration &amp; Standort</summary><div class=\"topic-body\"><p>• Wenn Sie unter Einstellungen → Aufnahme die Kalenderverknüpfung einschalten, wird beim Start einer Aufnahme der Name eines gerade laufenden Termins als Dateiname verwendet.<br>• Wenn Sie den Standort einschalten, werden Koordinaten und Adresse als Metadaten zur Aufnahme gespeichert (nicht in das Audio eingebettet).<br>• Mit „Ort in .md schreiben“ stehen Aufnahmedatum und Ort oben in den .md-Dateien für Transkription / Zusammenfassung, die in Ihre Cloud gesendet werden (standardmäßig aus; dann verlässt der Ort das Gerät nicht).<br>• Beides ist optional. Alle Funktionen gehen auch ohne.</p></div></details>\n<details id=\"background\"><summary>Über den Hintergrundbetrieb</summary><div class=\"topic-body\"><p>• Die Aufnahme läuft weiter, wenn der Bildschirm gesperrt ist oder Sie zu einer anderen App wechseln (Audio-Hintergrundmodus).<br>• Von Hand gestartete API-Aufrufe für Transkription / Zusammenfassung laufen einige Minuten im Hintergrund weiter; bei langen Aufgaben (besonders Pro-Reasoning-Modelle) lassen Sie die App am besten im Vordergrund.<br>• Bricht ein Cloud-Upload ab, wiederholt iOS ihn automatisch, sobald Zeit ist.</p></div></details>\n<details id=\"privacy\"><summary>Datenschutz und Datenverarbeitung</summary><div class=\"topic-body\"><p>• Aufnahmen werden nur auf Ihrem Gerät und in den von Ihnen gewählten Clouds gespeichert.<br>• API-Schlüssel / Dienstkonto-JSON werden verschlüsselt im Schlüsselbund Ihres Geräts gespeichert und nie an einen Voicloud-Direct-Server gesendet (es gibt keinen).<br>• Transkription und Zusammenfassungen werden direkt an den von Ihnen gewählten KI-Anbieter gesendet (OpenAI / Google / Vertex). Es gilt die Datenrichtlinie des jeweiligen Anbieters.<br>• Keinerlei Analyse, Werbung oder Tracking.</p></div></details>\n<details id=\"troubleshooting\"><summary>Wenn etwas nicht funktioniert</summary><div class=\"topic-body\"><p>Transkript fehlerhaft / bricht ab:<br>• OpenAI Whisper-1 fügt bekanntermaßen in stille Abschnitte Floskeln wie „Danke fürs Zuschauen“ ein. Der Wechsel zu gpt-4o-transcribe behebt das.<br>• Zeitmarken bei Gemini ungenau: Sofern Sie Einstellungen → Transkriptions-Prompt nicht angepasst haben, setzen Sie ihn auf die neueste Version zurück (Vorlage „Standard“).</p>\n<p>Kein Upload in die Cloud:<br>• Prüfen Sie, ob die Cloud in den Einstellungen als „Verbunden“ angezeigt wird.<br>• Das OAuth-Token kann abgelaufen sein – einmal trennen und neu verbinden.</p>\n<p>Die Aktionstaste reagiert nicht:<br>・Prüfe, ob unter iOS-Einstellungen &gt; Aktionstaste &gt; Steuerelemente „Voicloud Direct Recording“ ausgewählt ist.<br>・Beim ersten Mal musst du den Zugriff auf das Mikrofon erlauben. Lass außerdem „Live-Aktivitäten“ unter iOS-Einstellungen → Voicloud Direct eingeschaltet.<br>・Startet die Aufnahme im gesperrten Zustand nicht, drücke die Taste noch einmal.</p>\n<p>Hilft das nicht, schreiben Sie uns über „Kontakt“ unten.</p></div></details>", "relatedLinks": "Verwandte Links", "privacyLink": "Datenschutzrichtlinie", "contact": "<div class=\"contact-box\"><h3>Kontakt</h3><p>Bei Problemen, Funktionswünschen oder Fragen wenden Sie sich bitte per E-Mail an uns. Wir antworten innerhalb von 1–3 Werktagen.</p><p><a href=\"mailto:monma.free@gmail.com\">monma.free@gmail.com</a></p></div>"},
    "es": {"title": "Voicloud Direct — Ayuda / Soporte", "heading": "Ayuda / Soporte", "tagline": "Preguntas frecuentes y solución de problemas", "topics": "<details id=\"flow\"><summary>Uso básico</summary><div class=\"topic-body\"><p>Puedes grabar con el iPhone bloqueado. Al detener, el audio y la transcripción llegan a tu propia nube.</p>\n<p>Configuración inicial (solo una vez)<br>1. En la app, ve a Ajustes → «Sincronización en la nube» e inicia sesión en la nube donde quieras guardar (iCloud Drive no requiere iniciar sesión).<br>2. Asigna la grabación de Voicloud Direct al Action Button (iPhone 15 Pro o posterior; consulta «Action Button y Live Activity» más abajo). También puedes añadir el mismo control al Centro de control o a la pantalla de bloqueo.<br>3. Para que la transcripción también sea automática, introduce una clave de API en Ajustes → «Transcripción con IA (BYOK)» y activa «Transcribir automáticamente al detener» en Ajustes → «Automatización».</p>\n<p>Uso diario<br>1. Con el iPhone bloqueado, pulsa el Action Button para empezar a grabar. La pantalla de bloqueo y la Dynamic Island muestran el tiempo transcurrido.<br>2. Púlsalo de nuevo para detener.<br>3. La grabación se sube automáticamente a tus nubes conectadas. Si la transcripción automática está activada, los archivos .md de la transcripción (y del resumen) llegan a la misma nube. No hace falta abrir la app.</p>\n<p>También puedes abrir la app y grabar con el botón de grabación de la pantalla principal. Toca una grabación para abrir su pantalla de detalle, con reproducción, transcripción, resumen y «Enviar a IA».</p></div></details>\n<details id=\"microphone\"><summary>Grabar con un micrófono Bluetooth / AirPods</summary><div class=\"topic-body\"><p>Elígelo en Ajustes → Grabación → Micrófono.</p>\n<p>• Automático (preferir Bluetooth): usa el micrófono Bluetooth conectado.<br>• Micrófono del iPhone: usa siempre el micrófono integrado.</p>\n<p>La pantalla de grabación muestra qué micrófono se está usando.</p>\n<p>⚠️ Los micrófonos Bluetooth usan un enlace de calidad telefónica, por lo que el audio tiene menos calidad que el micrófono integrado y la precisión de la transcripción puede verse afectada. Elige «Micrófono del iPhone» cuando la calidad sea lo más importante.</p>\n<p>Si el Bluetooth se desconecta durante la grabación, la app cambia al micrófono del iPhone y sigue grabando (todo se guarda en un solo archivo). Conectar unos auriculares durante la grabación funciona del mismo modo.</p>\n<p>Si ya tenías grabaciones antes de esta actualización, el valor por omisión es «Micrófono del iPhone», para que una actualización nunca cambie en silencio el sonido de tus grabaciones.</p></div></details>\n<details id=\"cloud\"><summary>Conectar a la nube</summary><div class=\"topic-body\"><p>Se admiten cinco nubes: iCloud Drive / Google Drive / Dropbox / OneDrive / Box.</p>\n<p>• En Ajustes → Sincronización en la nube, toca el servicio que quieras conectar e inicia sesión.<br>• Cada grabación se sube automáticamente a todas las nubes conectadas (una grabación nueva recibe el siguiente número si ya existe un archivo con el mismo nombre; al volver a subirla se sobrescribe, y cada servicio guarda su propio historial).<br>• iCloud Drive no necesita iniciar sesión: funciona automáticamente si iCloud Drive está activado en iOS. Para «desconectarlo» en la app, desactívalo en la sección Sincronización en la nube.<br>• Si añades una nube después de grabar, aparece un botón «Sincronizar» en la sección Sincronización en la nube de la pantalla de detalles para subirla después.<br>• Aunque todo esté sincronizado, puedes forzar una nueva subida con el botón «Volver a subir» (se añade una nueva revisión en la nube).</p></div></details>\n<details id=\"ai_send\"><summary>Enviar audio a IA (Share Sheet)</summary><div class=\"topic-body\"><p>Toca «Enviar a la IA» en la pantalla de detalles para abrir la hoja de compartir de iOS.</p>\n<p>Si tienes NotebookLM instalado, puede importar el archivo de audio directamente. Gemini y ChatGPT a veces no aceptan audio compartido; en ese caso, abre la carpeta de la nube desde la app Archivos (está sincronizada automáticamente, así que encontrarás el mismo archivo enseguida).</p>\n<p>Consejo: en la hoja de compartir, toca «Editar» y añade NotebookLM a Favoritos para que aparezca siempre primero.</p></div></details>\n<details id=\"byok\"><summary>Transcripción BYOK (usar con API Key)</summary><div class=\"topic-body\"><p>Transcribe directamente en la app con una clave de API que consigas tú mismo.</p>\n<p>Proveedores compatibles:<br>• OpenAI (whisper-1 / gpt-4o-transcribe, etc. Sin separación de hablantes)<br>• Gemini AI Studio (con nivel gratuito, admite separación de hablantes)<br>• Vertex AI (cuenta de servicio de Google Cloud, admite separación de hablantes)</p>\n<p>Elige un proveedor en Ajustes → Transcripción con IA y pega tu clave de API. La clave se cifra en el Llavero de tu dispositivo y nunca se envía a un servidor de Voicloud Direct (no existe ninguno).</p>\n<p>Si necesitas separar hablantes, elige una opción de Gemini. OpenAI es muy preciso, pero no da etiquetas de hablante.</p></div></details>\n<details id=\"auto\"><summary>Transcripciones y resúmenes automáticos</summary><div class=\"topic-body\"><p>Activa «Transcribir automáticamente al detener» en Ajustes → Automatización. Al detener una grabación, la app crea la transcripción y sube el .md a tu nube sin que tengas que abrirla. Activa también «Crear también un resumen» para subir el .md del resumen.</p>\n<p>Funciona también con grabaciones iniciadas y detenidas desde la pantalla bloqueada. iOS se encarga de las solicitudes a la IA y de las subidas, así que la app puede quedarse cerrada. iOS decide cuándo se hace. Normalmente llega en unos minutos, pero puede tardar más según la batería y la red.</p>\n<p>Con «Subir solo con Wi‑Fi», las subidas y el procesamiento de IA esperan mientras usas datos móviles y continúan cuando vuelves a una red Wi‑Fi.</p>\n<p>Necesitas una clave de API de transcripción con IA y aceptar el envío de datos a una IA externa.</p></div></details>\n<details id=\"summary\"><summary>Resumen y prompt de resumen</summary><div class=\"topic-body\"><p>Con una grabación ya transcrita, también puedes generar un resumen con el mismo proveedor.</p>\n<p>En Ajustes → Prompt de resumen, elige un estilo entre los preajustes o escribe el tuyo (Estándar / Acta de reunión / Conversación informal / Entrevista / Nota).</p>\n<p>OpenAI usa familias de modelos totalmente distintas para transcribir y resumir, así que hay un campo aparte para el modelo de resumen (p. ej., gpt-4o-mini o gpt-5).</p>\n<p>Los modelos Pro / de razonamiento (p. ej., o3-pro / gpt-5.5-pro) tardan más en pensar pero dan mejores resultados.</p></div></details>\n<details id=\"diarization\"><summary>Consejos para speaker diarization</summary><div class=\"topic-body\"><p>La separación de hablantes con Gemini tiende a confundir voces parecidas, como personas del mismo género y edad.</p>\n<p>Qué ayuda:<br>• En la pantalla de detalles, pon «Hablantes» en el número real (p. ej., 4) en lugar de Automático para forzar exactamente esa cantidad.<br>• Si notas confusiones, añade tus propias pistas en Ajustes → Prompt de transcripción (muletillas, acentos, roles, etc.).<br>• Un modelo Pro (p. ej., gemini-2.5-pro) capta rasgos de voz más finos que Flash y suele ser más preciso (aunque tarda de 3 a 5 veces más).</p>\n<p>OpenAI Whisper / gpt-4o-transcribe no pueden separar hablantes. Elige Gemini / Vertex si necesitas etiquetas de hablante.</p></div></details>\n<details id=\"playback\"><summary>Reproducción, búsqueda y velocidad</summary><div class=\"topic-body\"><p>• Toca o arrastra la onda para saltar a ese punto y reproducir desde ahí.<br>• Toca «1x» a la izquierda para cambiar la velocidad: 1x → 1.5x → 2x → 0.5x.<br>• También puedes usar los botones de retroceder / avanzar 10 segundos.<br>• Mientras te desplazas por la transcripción o el resumen, la onda y el tiempo de reproducción quedan fijados arriba.</p></div></details>\n<details id=\"edit\"><summary>Recortar, silenciar y deshacer</summary><div class=\"topic-body\"><p>Desde «Recortar» en la pantalla de detalle puedes cortar una parte de la grabación o silenciarla.</p>\n<p>• Recortar: conserva solo el intervalo que seleccionas.<br>• Silenciar: deja sin sonido el intervalo seleccionado. La duración de la grabación no cambia. También se elimina esa parte de la transcripción y, si hay resumen, se vuelve a generar.<br>• Elige el intervalo con los tiradores amarillos de ambos extremos. Arrastra el tirador que está sobre el marco para mover todo el intervalo sin cambiar su duración (los botones −1s / +1s bajo «Duración» hacen lo mismo).<br>• Mientras la pantalla de edición está abierta, esa grabación no se envía a la nube. El envío se reanuda automáticamente al cerrarla. Tras una edición, se vuelve a enviar el audio editado.<br>• El audio anterior a la edición se guarda 3 días en el dispositivo, y «Deshacer edición» en la pantalla de detalle lo recupera (hasta las 3 últimas ediciones). También vuelven la transcripción y el resumen, y el audio original se envía de nuevo a la nube.<br>• Para eliminarlo de inmediato, usa «Eliminar ahora el audio original». Una vez eliminado, la edición ya no se puede deshacer.<br>• El audio anterior a la edición se queda solo en el dispositivo y nunca se envía a la nube. Sin embargo, el audio que ya se había subido antes de la edición puede permanecer en el historial de versiones del servicio en la nube.</p></div></details>\n<details id=\"action_button\"><summary>Action Button y Live Activity (iPhone 15 Pro o posterior)</summary><div class=\"topic-body\"><p>En el iPhone 15 Pro y posteriores, puedes empezar a grabar con el botón de Acción del lateral. En Ajustes &gt; Botón de Acción &gt; Controles, elige «Voicloud Direct Recording». Después, basta con pulsar el botón para iniciar o detener la grabación, incluso con el iPhone bloqueado.</p>\n<p>Durante la grabación aparece una insignia roja en la Dynamic Island y en la pantalla de bloqueo con el tiempo transcurrido.</p>\n<p>Si el micrófono cambia durante una grabación iniciada con el iPhone bloqueado (por ejemplo, si los AirPods pasan a otro dispositivo), la grabación se guarda hasta ese momento y se detiene.</p>\n<p>También puedes usar «Alternar grabación», «Iniciar grabación» y «Detener grabación» desde Atajos de Siri.</p></div></details>\n<details id=\"calendar_location\"><summary>Integración con calendario y ubicación</summary><div class=\"topic-body\"><p>• Si activas la vinculación con el calendario en Ajustes → Grabación y hay un evento en curso al empezar a grabar, su nombre se usa como nombre de archivo.<br>• Si activas la ubicación, las coordenadas y la dirección se guardan como metadatos de la grabación (no se incrustan en el audio).<br>• Activa «Escribir la ubicación en el .md» para poner la fecha y el lugar de la grabación al inicio de los .md de transcripción / resumen enviados a tu nube (desactivado por defecto; así la ubicación no sale del dispositivo).<br>• Ambas opciones son opcionales. Todo funciona igual con ellas desactivadas.</p></div></details>\n<details id=\"background\"><summary>Acerca del funcionamiento en segundo plano</summary><div class=\"topic-body\"><p>• La grabación continúa aunque se bloquee la pantalla o cambies a otra app (modo de audio en segundo plano).<br>• Las llamadas a la API de transcripción / resumen que inicias a mano siguen activas en segundo plano unos minutos, pero para tareas largas (sobre todo modelos Pro de razonamiento) lo más seguro es dejar la app en primer plano.<br>• Si una subida a la nube se detiene a medias, iOS la reintenta automáticamente cuando puede.</p></div></details>\n<details id=\"privacy\"><summary>Privacidad y gestión de datos</summary><div class=\"topic-body\"><p>• Las grabaciones se guardan solo en tu dispositivo y en las nubes que elijas.<br>• Las claves de API / el JSON de la cuenta de servicio se cifran en el Llavero de tu dispositivo y nunca se envían a un servidor de Voicloud Direct (no existe ninguno).<br>• La transcripción y los resúmenes se envían directamente al proveedor de IA que elijas (OpenAI / Google / Vertex). Se aplica la política de datos de cada proveedor.<br>• Sin análisis, publicidad ni seguimiento de ningún tipo.</p></div></details>\n<details id=\"troubleshooting\"><summary>Cuando algo no funciona</summary><div class=\"topic-body\"><p>La transcripción sale mal / se detiene a medias:<br>• OpenAI Whisper-1 suele insertar frases como «Gracias por ver el vídeo» en los silencios. Cambiar a gpt-4o-transcribe lo soluciona.<br>• Marcas de tiempo inexactas con Gemini: salvo que hayas personalizado Ajustes → Prompt de transcripción, restáuralo a la última versión (preajuste «Estándar»).</p>\n<p>No se sube a la nube:<br>• Comprueba que la nube aparezca como «Conectada» en Ajustes.<br>• Puede que el token OAuth haya caducado: desconecta y vuelve a conectar.</p>\n<p>El botón de Acción no responde:<br>・Comprueba que «Voicloud Direct Recording» esté seleccionado en Ajustes de iOS &gt; Botón de Acción &gt; Controles.<br>・La primera vez debes permitir el acceso al micrófono. Mantén también activadas las «Actividades en directo» en Ajustes de iOS → Voicloud Direct.<br>・Si la grabación no empieza al pulsarlo con el iPhone bloqueado, vuelve a pulsarlo.</p>\n<p>Si aun así no se resuelve, escríbenos desde «Contacto» abajo.</p></div></details>", "relatedLinks": "Enlaces relacionados", "privacyLink": "Política de privacidad", "contact": "<div class=\"contact-box\"><h3>Contacto</h3><p>Para errores, solicitudes de funciones o cualquier pregunta, escríbenos por correo electrónico. Respondemos en 1-3 días hábiles.</p><p><a href=\"mailto:monma.free@gmail.com\">monma.free@gmail.com</a></p></div>"},
    "fr": {"title": "Voicloud Direct — Aide / Support", "heading": "Aide / Support", "tagline": "Foire aux questions et résolution des problèmes", "topics": "<details id=\"flow\"><summary>Utilisation de base</summary><div class=\"topic-body\"><p>Vous pouvez enregistrer sans déverrouiller l’iPhone. À l’arrêt, l’audio et la transcription arrivent dans votre propre cloud.</p>\n<p>À configurer une seule fois<br>1. Dans l’app, ouvrez Réglages → « Synchronisation cloud » et connectez-vous au cloud où enregistrer (iCloud Drive ne demande pas de connexion).<br>2. Attribuez l’enregistrement Voicloud Direct au bouton Action (iPhone 15 Pro et versions ultérieures ; voir « Action Button et Live Activity » plus bas). Vous pouvez aussi ajouter la même commande au Centre de contrôle ou à l’écran verrouillé.<br>3. Pour que la transcription soit elle aussi automatique, saisissez une clé API dans Réglages → « Transcription IA (BYOK) », puis activez « Transcrire automatiquement à l’arrêt » dans Réglages → « Automatisation ».</p>\n<p>Au quotidien<br>1. iPhone verrouillé, appuyez sur le bouton Action pour démarrer l’enregistrement. L’écran verrouillé et la Dynamic Island affichent le temps écoulé.<br>2. Appuyez de nouveau pour arrêter.<br>3. L’enregistrement est envoyé automatiquement vers vos clouds connectés. Si la transcription automatique est activée, les fichiers .md de la transcription (et du résumé) arrivent dans le même cloud. Inutile d’ouvrir l’app.</p>\n<p>Vous pouvez aussi ouvrir l’app et enregistrer avec le bouton d’enregistrement de l’écran d’accueil. Touchez un enregistrement pour ouvrir son écran de détail : lecture, transcription, résumé et « Envoyer à l’IA ».</p></div></details>\n<details id=\"microphone\"><summary>Enregistrer avec un micro Bluetooth / AirPods</summary><div class=\"topic-body\"><p>Choisissez-le dans Réglages → Enregistrement → Microphone.</p>\n<p>• Automatique (Bluetooth prioritaire) : utilise le micro Bluetooth connecté.<br>• Micro de l'iPhone : utilise toujours le micro intégré.</p>\n<p>L'écran d'enregistrement indique quel micro est utilisé.</p>\n<p>⚠️ Les micros Bluetooth utilisent une liaison de qualité téléphonique : le son est donc moins bon qu'avec le micro intégré et la précision de la transcription peut en pâtir. Choisissez « Micro de l'iPhone » lorsque la qualité prime.</p>\n<p>Si le Bluetooth se déconnecte pendant l'enregistrement, l'app bascule sur le micro de l'iPhone et continue d'enregistrer (tout reste dans un seul fichier). Connecter un casque en cours d'enregistrement provoque la même bascule.</p>\n<p>Si vous aviez déjà des enregistrements avant cette mise à jour, la valeur par défaut est « Micro de l'iPhone » : une mise à jour ne change jamais silencieusement le son de vos enregistrements.</p></div></details>\n<details id=\"cloud\"><summary>Se connecter au cloud</summary><div class=\"topic-body\"><p>Cinq clouds sont pris en charge : iCloud Drive / Google Drive / Dropbox / OneDrive / Box.</p>\n<p>• Dans Réglages → Synchronisation cloud, touchez le service à connecter et connectez-vous.<br>• Chaque enregistrement est envoyé automatiquement vers tous les clouds connectés (un nouvel enregistrement reçoit le numéro suivant si un fichier du même nom existe déjà ; un renvoi écrase le fichier du même nom, et chaque service conserve son propre historique).<br>• iCloud Drive ne demande aucune connexion : il fonctionne automatiquement si iCloud Drive est activé dans iOS. Pour le « déconnecter » dans l'app, désactivez-le dans la section Synchronisation cloud.<br>• Si vous ajoutez un cloud après l'enregistrement, un bouton « Synchroniser » apparaît dans la section Synchronisation cloud de l'écran de détails pour l'envoyer ensuite.<br>• Même si tout est synchronisé, vous pouvez forcer un nouvel envoi avec le bouton « Renvoyer » (une nouvelle révision est ajoutée côté cloud).</p></div></details>\n<details id=\"ai_send\"><summary>Envoyer l'audio à l'IA (Share Sheet)</summary><div class=\"topic-body\"><p>Touchez « Envoyer à l'IA » dans l'écran de détails pour ouvrir la feuille de partage d'iOS.</p>\n<p>Si NotebookLM est installé, il peut importer directement le fichier audio. Gemini et ChatGPT n'acceptent pas toujours les fichiers audio partagés ; dans ce cas, ouvrez plutôt le dossier cloud via l'app Fichiers (il est synchronisé automatiquement, vous trouverez tout de suite le même fichier).</p>\n<p>Astuce : dans la feuille de partage, touchez « Modifier » et ajoutez NotebookLM aux favoris pour qu'il apparaisse toujours en premier.</p></div></details>\n<details id=\"byok\"><summary>Transcription BYOK (avec API Key)</summary><div class=\"topic-body\"><p>Transcrivez directement dans l'app avec une clé API que vous obtenez vous-même.</p>\n<p>Fournisseurs pris en charge :<br>• OpenAI (whisper-1 / gpt-4o-transcribe, etc. Pas de séparation des locuteurs)<br>• Gemini AI Studio (offre gratuite, séparation des locuteurs)<br>• Vertex AI (compte de service Google Cloud, séparation des locuteurs)</p>\n<p>Choisissez un fournisseur dans Réglages → Transcription par IA et collez votre clé API. La clé est chiffrée dans le trousseau de votre appareil et n'est jamais envoyée à un serveur Voicloud Direct (il n'y en a pas).</p>\n<p>Si vous avez besoin de séparer les locuteurs, choisissez Gemini. OpenAI est très précis mais ne fournit pas d'étiquettes de locuteur.</p></div></details>\n<details id=\"auto\"><summary>Transcriptions et résumés automatiques</summary><div class=\"topic-body\"><p>Activez « Transcrire automatiquement à l’arrêt » dans Réglages → Automatisation. À l'arrêt d'un enregistrement, l'app crée la transcription et envoie le .md dans votre cloud, sans que vous ayez à l'ouvrir. Activez aussi « Créer aussi un résumé » pour envoyer le .md du résumé.</p>\n<p>Cela fonctionne aussi pour les enregistrements lancés et arrêtés depuis l'écran verrouillé. iOS prend en charge les requêtes à l'IA et les envois, l'app peut donc rester fermée. C'est iOS qui décide du moment. En général, tout arrive en quelques minutes, mais cela peut prendre plus longtemps selon la batterie et le réseau.</p>\n<p>Avec « Envoyer uniquement en Wi‑Fi », les envois et le traitement IA attendent tant que vous êtes en données mobiles et reprennent dès que vous êtes en Wi‑Fi.</p>\n<p>Il faut une clé API de transcription IA et votre accord pour envoyer des données à une IA externe.</p></div></details>\n<details id=\"summary\"><summary>Résumé et prompt de synthèse</summary><div class=\"topic-body\"><p>Pour un enregistrement déjà transcrit, vous pouvez aussi générer un résumé avec le même fournisseur.</p>\n<p>Dans Réglages → Prompt de résumé, choisissez un style parmi les préréglages ou rédigez le vôtre (Standard / Compte rendu de réunion / Conversation informelle / Interview / Note).</p>\n<p>OpenAI utilise des familles de modèles totalement distinctes pour la transcription et le résumé ; il y a donc un champ séparé pour le modèle de résumé (ex. gpt-4o-mini ou gpt-5).</p>\n<p>Les modèles Pro / à raisonnement (ex. o3-pro / gpt-5.5-pro) réfléchissent plus longtemps mais donnent de meilleurs résultats.</p></div></details>\n<details id=\"diarization\"><summary>Conseils pour la diarization</summary><div class=\"topic-body\"><p>La séparation des locuteurs avec Gemini confond facilement les voix proches, comme des personnes de même sexe et de même âge.</p>\n<p>Ce qui aide :<br>• Dans l'écran de détails, réglez « Locuteurs » sur le nombre réel (ex. 4) au lieu d'Automatique pour imposer exactement ce nombre.<br>• Si vous remarquez des confusions, ajoutez vos propres indices dans Réglages → Prompt de transcription (tics de langage, accents, rôles, etc.).<br>• Un modèle Pro (ex. gemini-2.5-pro) saisit des caractéristiques vocales plus fines que Flash et est souvent plus précis (mais 3 à 5 fois plus lent).</p>\n<p>OpenAI Whisper / gpt-4o-transcribe ne savent pas du tout séparer les locuteurs. Choisissez Gemini / Vertex si vous avez besoin d'étiquettes de locuteur.</p></div></details>\n<details id=\"playback\"><summary>Lecture, déplacement et vitesse</summary><div class=\"topic-body\"><p>• Touchez ou faites glisser la forme d'onde pour aller à ce point et lire à partir de là.<br>• Touchez « 1x » à gauche pour changer la vitesse : 1x → 1.5x → 2x → 0.5x.<br>• Les boutons reculer / avancer de 10 secondes sont aussi disponibles.<br>• Pendant que vous faites défiler la transcription ou le résumé, la forme d'onde et le temps de lecture restent épinglés en haut.</p></div></details>\n<details id=\"edit\"><summary>Couper, rendre muet et annuler</summary><div class=\"topic-body\"><p>Depuis « Raccourcir » sur l’écran de détail, vous pouvez couper une partie d’un enregistrement ou la rendre muette.</p>\n<p>• Couper : seule la plage sélectionnée est conservée.<br>• Rendre muet : le son de la plage sélectionnée est supprimé. La durée de l’enregistrement ne change pas. La partie correspondante de la transcription est aussi supprimée et le résumé, s’il existe, est refait.<br>• Choisissez la plage avec les poignées jaunes aux deux extrémités. Faites glisser la poignée au-dessus du cadre pour déplacer toute la plage sans changer sa durée (les boutons −1s / +1s sous « Durée » font de même).<br>• Tant que l’écran de modification est ouvert, cet enregistrement n’est pas envoyé vers le cloud. L’envoi reprend automatiquement à la fermeture. Après une modification, l’audio modifié est renvoyé.<br>• L’audio d’avant la modification est conservé 3 jours sur l’appareil, et « Annuler la modification » sur l’écran de détail le rétablit (jusqu’aux 3 dernières modifications). La transcription et le résumé reviennent aussi, et l’audio d’origine est renvoyé vers le cloud.<br>• Pour le supprimer tout de suite, utilisez « Supprimer l’audio d’origine maintenant ». Une fois supprimé, la modification ne peut plus être annulée.<br>• L’audio d’avant la modification reste uniquement sur l’appareil et n’est jamais envoyé vers le cloud. Toutefois, un audio déjà envoyé avant la modification peut rester dans l’historique des versions du service cloud.</p></div></details>\n<details id=\"action_button\"><summary>Action Button et Live Activity (iPhone 15 Pro et versions ultérieures)</summary><div class=\"topic-body\"><p>Sur iPhone 15 Pro et modèles ultérieurs, vous pouvez lancer l’enregistrement avec le bouton Action sur le côté. Dans Réglages &gt; Bouton Action &gt; Commandes, choisissez « Voicloud Direct Recording ». Il suffit ensuite d’appuyer sur le bouton pour démarrer ou arrêter l’enregistrement, même lorsque l’iPhone est verrouillé.</p>\n<p>Pendant l’enregistrement, un badge rouge apparaît dans la Dynamic Island et sur l’écran verrouillé avec la durée écoulée.</p>\n<p>Si le micro change pendant un enregistrement lancé iPhone verrouillé (par exemple, si les AirPods passent sur un autre appareil), l’enregistrement est sauvegardé jusqu’à ce moment puis s’arrête.</p>\n<p>Vous pouvez aussi utiliser « Basculer l’enregistrement », « Démarrer l’enregistrement » et « Arrêter l’enregistrement » depuis les raccourcis Siri.</p></div></details>\n<details id=\"calendar_location\"><summary>Intégration calendrier et localisation</summary><div class=\"topic-body\"><p>• Si vous activez la liaison au calendrier dans Réglages → Enregistrement et qu'un événement est en cours au début de l'enregistrement, son nom devient le nom du fichier.<br>• Si vous activez la localisation, les coordonnées et l'adresse sont enregistrées comme métadonnées (elles ne sont pas intégrées à l'audio).<br>• Activez « Écrire le lieu dans le .md » pour placer la date et le lieu de l’enregistrement en tête des .md de transcription / résumé envoyés vers votre cloud (désactivé par défaut ; le lieu ne quitte alors pas l’appareil).<br>• Les deux sont facultatifs. Tout fonctionne aussi lorsqu'ils sont désactivés.</p></div></details>\n<details id=\"background\"><summary>À propos du fonctionnement en arrière-plan</summary><div class=\"topic-body\"><p>• L'enregistrement continue écran verrouillé ou lorsque vous passez à une autre app (mode audio en arrière-plan).<br>• Les appels d'API de transcription / résumé lancés à la main restent actifs quelques minutes en arrière-plan, mais pour les tâches longues (surtout les modèles Pro à raisonnement), mieux vaut garder l'app au premier plan.<br>• Si un envoi vers le cloud s'interrompt, iOS le relance automatiquement dès que possible.</p></div></details>\n<details id=\"privacy\"><summary>Confidentialité et gestion des données</summary><div class=\"topic-body\"><p>• Les enregistrements sont stockés uniquement sur votre appareil et dans les clouds que vous choisissez.<br>• Les clés API / le JSON du compte de service sont chiffrés dans le trousseau de votre appareil et ne sont jamais envoyés à un serveur Voicloud Direct (il n'y en a pas).<br>• La transcription et les résumés sont envoyés directement au fournisseur d'IA de votre choix (OpenAI / Google / Vertex). La politique de données de chaque fournisseur s'applique.<br>• Aucune analyse, publicité ni aucun suivi.</p></div></details>\n<details id=\"troubleshooting\"><summary>En cas de problème</summary><div class=\"topic-body\"><p>La transcription est incorrecte / s'arrête en cours :<br>• OpenAI Whisper-1 insère souvent des formules comme « Merci d'avoir regardé » dans les silences. Passer à gpt-4o-transcribe corrige le problème.<br>• Horodatages imprécis avec Gemini : si vous n'avez pas personnalisé Réglages → Prompt de transcription, rétablissez la dernière version (préréglage « Standard »).</p>\n<p>Aucun envoi vers le cloud :<br>• Vérifiez que le cloud apparaît comme « Connecté » dans les réglages.<br>• Le jeton OAuth a peut-être expiré : déconnectez puis reconnectez une fois.</p>\n<p>Le bouton Action ne répond pas :<br>・Vérifiez que « Voicloud Direct Recording » est sélectionné dans Réglages iOS &gt; Bouton Action &gt; Commandes.<br>・La première fois, vous devez autoriser l’accès au micro. Laissez aussi « Activités en direct » activé dans Réglages iOS → Voicloud Direct.<br>・Si l’enregistrement ne démarre pas lorsque vous appuyez iPhone verrouillé, appuyez une nouvelle fois.</p>\n<p>Si le problème persiste, contactez-nous via « Contact » ci-dessous.</p></div></details>", "relatedLinks": "Liens utiles", "privacyLink": "Politique de confidentialité", "contact": "<div class=\"contact-box\"><h3>Nous contacter</h3><p>Pour signaler un problème, faire une demande de fonctionnalité ou poser une question, envoyez-nous un e-mail. Nous vous répondrons dans un délai de 1 à 3 jours ouvrés.</p><p><a href=\"mailto:monma.free@gmail.com\">monma.free@gmail.com</a></p></div>"},
    "ko": {"title": "Voicloud Direct — 도움말 / 지원", "heading": "도움말 / 지원", "tagline": "자주 묻는 질문 및 트러블슈팅", "topics": "<details id=\"flow\"><summary>기본 사용 방법</summary><div class=\"topic-body\"><p>iPhone을 잠근 채로 녹음할 수 있고, 멈추기만 하면 오디오와 텍스트 변환이 내 클라우드에 도착합니다.</p>\n<p>처음에 한 번만<br>1. 앱의 설정 → ‘클라우드 동기화’에서 저장할 클라우드에 로그인합니다(iCloud Drive는 로그인이 필요 없습니다).<br>2. 동작 버튼에 Voicloud Direct 녹음을 지정합니다(iPhone 15 Pro 이상. 방법은 아래의 ‘Action Button 및 Live Activity’ 참고). 같은 컨트롤을 제어 센터나 잠금 화면에도 둘 수 있습니다.<br>3. 텍스트 변환까지 자동으로 하려면 설정 → ‘AI 전사 (BYOK)’에 API 키를 넣고, 설정 → ‘자동 처리’에서 ‘중지하면 자동으로 받아쓰기’를 켭니다.</p>\n<p>평소 사용법<br>1. 잠금 화면 그대로 동작 버튼을 눌러 녹음을 시작합니다. 잠금 화면과 Dynamic Island에 경과 시간이 표시됩니다.<br>2. 한 번 더 눌러 멈춥니다.<br>3. 녹음은 연결된 클라우드로 자동 업로드됩니다. 자동 텍스트 변환을 켜 두었다면 텍스트 변환(과 요약) .md 파일도 같은 클라우드에 도착합니다. 앱을 열 필요가 없습니다.</p>\n<p>앱을 열어 홈 화면의 녹음 버튼으로 녹음할 수도 있습니다. 녹음을 탭하면 상세 화면이 열리고, 재생·텍스트 변환·요약·‘AI로 보내기’를 사용할 수 있습니다.</p></div></details>\n<details id=\"microphone\"><summary>Bluetooth / AirPods 마이크로 녹음</summary><div class=\"topic-body\"><p>설정 → 녹음 → 마이크에서 선택합니다.</p>\n<p>• 자동 (블루투스 우선): 연결된 Bluetooth 마이크를 사용합니다.<br>• iPhone 마이크: 항상 내장 마이크를 사용합니다.</p>\n<p>녹음 화면에 현재 사용 중인 마이크가 표시됩니다.</p>\n<p>⚠️ Bluetooth 마이크는 통화용 회선을 사용하므로 내장 마이크보다 음질이 낮고 문자 변환 정확도에도 영향을 줄 수 있습니다. 음질을 우선한다면 「iPhone 마이크」를 선택해 주세요.</p>\n<p>녹음 중 Bluetooth 연결이 끊어져도 자동으로 iPhone 마이크로 전환해 녹음을 계속합니다 (하나의 파일로 저장됩니다). 녹음 중에 연결한 경우에도 같은 방식으로 전환됩니다.</p>\n<p>이번 업데이트 이전부터 녹음이 있었다면, 업데이트로 음질이 조용히 바뀌지 않도록 기본값은 「iPhone 마이크」입니다.</p></div></details>\n<details id=\"cloud\"><summary>클라우드에 연결하기</summary><div class=\"topic-body\"><p>지원 클라우드: iCloud Drive / Google Drive / Dropbox / OneDrive / Box 5가지.</p>\n<p>• 설정 → 클라우드 동기화에서 연결할 서비스를 탭하고 로그인합니다.<br>• 녹음은 연결된 모든 클라우드에 자동으로 업로드됩니다 (새 녹음은 같은 이름의 파일이 있으면 번호를 올려서 보냅니다. 다시 보낼 때는 같은 이름을 덮어쓰며, 이력은 각 서비스에서 보관).<br>• iCloud Drive는 로그인이 필요 없습니다. iOS에서 iCloud Drive가 켜져 있으면 자동으로 사용됩니다. 앱에서 「연결 해제」하려면 클라우드 동기화 섹션에서 끌 수 있습니다.<br>• 녹음 후에 클라우드를 추가하면 상세 화면의 「클라우드 동기화」 섹션에 「동기화」 버튼이 나타나 나중에 업로드할 수 있습니다.<br>• 모든 클라우드에 동기화된 상태에서도 강제로 다시 올리고 싶을 때는 「다시 업로드」 버튼을 쓸 수 있습니다 (클라우드에 새 리비전이 쌓입니다).</p></div></details>\n<details id=\"ai_send\"><summary>음성을 AI에 전송（Share Sheet）</summary><div class=\"topic-body\"><p>상세 화면에서 「AI에 보내기」를 탭하면 iOS 공유 시트가 열립니다.</p>\n<p>NotebookLM이 설치되어 있으면 음성 파일을 바로 가져올 수 있습니다. Gemini나 ChatGPT는 공유된 음성 파일을 받지 않는 경우가 있으니, 그럴 때는 파일 앱에서 클라우드 폴더를 여는 방법을 권장합니다 (자동 동기화되므로 같은 파일을 바로 찾을 수 있습니다).</p>\n<p>팁: 공유 시트에서 「편집」 → NotebookLM을 「즐겨찾기」에 추가하면 항상 맨 위에 표시됩니다.</p></div></details>\n<details id=\"byok\"><summary>BYOK 전사（API Key로 사용）</summary><div class=\"topic-body\"><p>직접 발급받은 API 키로 앱에서 바로 문자 변환할 수 있습니다.</p>\n<p>지원 제공자:<br>• OpenAI (whisper-1 / gpt-4o-transcribe 등. 화자 분리 미지원)<br>• Gemini AI Studio (무료 사용량 있음, 화자 분리 지원)<br>• Vertex AI (Google Cloud 서비스 계정, 화자 분리 지원)</p>\n<p>설정 → AI 문자 변환에서 제공자를 고르고 API 키를 붙여 넣습니다. 키는 기기의 키체인에 암호화되어 저장되며, Voicloud Direct 서버로는 전송되지 않습니다 (애초에 서버가 없습니다).</p>\n<p>화자 분리가 필요하면 Gemini 계열을 선택해 주세요. OpenAI는 정확도가 뛰어나지만 화자 라벨은 나오지 않습니다.</p></div></details>\n<details id=\"auto\"><summary>자동 전사·요약</summary><div class=\"topic-body\"><p>설정 → 자동 처리에서 '중지하면 자동으로 받아쓰기'를 켜면, 녹음을 멈춘 뒤 앱을 열지 않아도 전사를 만들고 .md를 클라우드에 업로드합니다. '요약도 이어서 만들기'도 켜면 요약 .md도 업로드합니다.</p>\n<p>잠금 화면에서 시작하고 멈춘 녹음에서도 동작합니다. AI 요청과 클라우드 업로드는 iOS가 맡아서 이어가므로 앱을 닫아 두어도 됩니다. 언제 진행할지는 iOS가 정합니다. 보통 몇 분 안에 도착하지만, 배터리나 네트워크 상태에 따라 더 걸릴 수 있습니다.</p>\n<p>'Wi‑Fi에서만 업로드'를 켜면 모바일 데이터에서는 업로드와 AI 처리를 기다렸다가 Wi‑Fi에 연결되면 이어갑니다.</p>\n<p>AI 전사 API 키와 외부 AI로 데이터를 보내는 것에 대한 동의가 필요합니다.</p></div></details>\n<details id=\"summary\"><summary>요약 및 요약 프롬프트</summary><div class=\"topic-body\"><p>문자 변환을 마친 녹음은 같은 제공자로 요약도 만들 수 있습니다.</p>\n<p>설정 → 요약 프롬프트에서 요약 스타일을 프리셋 중에서 고르거나 직접 작성할 수 있습니다 (표준 / 회의록 / 잡담 / 인터뷰 / 메모).</p>\n<p>OpenAI는 문자 변환과 요약의 모델 계열이 완전히 달라, 요약용 모델을 따로 지정하는 칸이 있습니다 (예: gpt-4o-mini, gpt-5).</p>\n<p>Pro / reasoning 계열(예: o3-pro / gpt-5.5-pro)은 추론 시간이 길어지는 대신 품질이 올라갑니다.</p></div></details>\n<details id=\"diarization\"><summary>화자 분리 팁</summary><div class=\"topic-body\"><p>Gemini 계열의 화자 분리는 성별과 연령대가 같아 목소리가 비슷한 화자를 혼동하기 쉽습니다.</p>\n<p>대책:<br>• 상세 화면의 「화자 수」를 자동 대신 실제 인원(예: 4명)으로 설정하면 정확히 그 인원으로 나누도록 강제할 수 있습니다.<br>• 혼동을 발견하면 설정 → 문자 변환 프롬프트에서 독자적인 단서(말버릇, 억양, 역할 등)를 추가할 수 있습니다.<br>• 문자 변환 모델을 Pro 계열(gemini-2.5-pro 등)로 하면 Flash보다 세밀한 음성 특징을 다룰 수 있어 정확도가 오르는 경향이 있습니다(단, 시간은 3~5배).</p>\n<p>OpenAI Whisper / gpt-4o-transcribe는 화자 분리 자체가 불가능합니다. 화자 라벨이 필요하면 Gemini / Vertex를 선택해 주세요.</p></div></details>\n<details id=\"playback\"><summary>재생 · 탐색 · 속도</summary><div class=\"topic-body\"><p>• 파형을 탭하거나 드래그하면 그 위치로 이동해 재생할 수 있습니다.<br>• 왼쪽의 「1x」를 탭하면 재생 속도가 1x → 1.5x → 2x → 0.5x 순으로 바뀝니다.<br>• 10초 뒤로 / 앞으로 버튼도 함께 사용할 수 있습니다.<br>• 문자 변환이나 요약을 스크롤하는 동안에도 파형과 재생 시간은 화면 위쪽에 고정되어 있습니다.</p></div></details>\n<details id=\"edit\"><summary>잘라내기 · 무음 · 되돌리기</summary><div class=\"topic-body\"><p>상세 화면의 ‘다듬기’에서 녹음의 일부를 잘라내거나 무음으로 만들 수 있습니다.</p>\n<p>• 잘라내기: 선택한 범위만 남깁니다.<br>• 무음으로: 선택한 범위의 소리를 지웁니다. 녹음 길이는 변하지 않습니다. 텍스트 변환의 해당 부분도 지우고, 요약이 있으면 다시 만듭니다.<br>• 범위는 양 끝의 노란 손잡이로 고릅니다. 틀 위의 손잡이를 움직이면 길이를 바꾸지 않고 범위 전체를 옮길 수 있습니다(‘길이’ 아래의 −1s / +1s 버튼으로도 옮길 수 있습니다).<br>• 편집 화면이 열려 있는 동안에는 그 녹음을 클라우드로 보내지 않습니다. 닫으면 자동으로 다시 시작합니다. 편집한 경우에는 편집된 오디오를 다시 보냅니다.<br>• 편집 전 오디오는 3일 동안 기기에 보관되며, 상세 화면의 ‘편집 되돌리기’로 되돌릴 수 있습니다(최근 3회분). 텍스트 변환과 요약도 함께 돌아오고, 원래 오디오를 클라우드로 다시 보냅니다.<br>• 바로 지우려면 ‘편집 전 오디오 지금 삭제’를 사용합니다. 지우면 되돌릴 수 없습니다.<br>• 편집 전 오디오는 기기 안에만 두며 클라우드로 보내지 않습니다. 다만 편집 전에 이미 업로드가 끝난 오디오는 클라우드 서비스의 버전 기록에 남을 수 있습니다.</p></div></details>\n<details id=\"action_button\"><summary>Action Button 및 Live Activity（iPhone 15 Pro 이상）</summary><div class=\"topic-body\"><p>iPhone 15 Pro 이상에서는 측면의 동작 버튼으로 녹음을 시작할 수 있습니다. 설정 &gt; 동작 버튼 &gt; 제어 항목에서 'Voicloud Direct Recording'을 선택하면, 버튼을 누르기만 해도 녹음을 시작하거나 멈출 수 있습니다. iPhone이 잠겨 있어도 녹음을 시작할 수 있습니다.</p>\n<p>녹음 중에는 Dynamic Island와 잠금 화면에 빨간 배지가 표시되어 경과 시간을 볼 수 있습니다.</p>\n<p>잠금 상태에서 시작한 녹음은 도중에 마이크가 바뀌면(AirPods가 다른 기기로 넘어가는 경우 등) 그때까지의 녹음을 저장하고 멈춥니다.</p>\n<p>Siri 단축어에서도 '녹음 전환', '녹음 시작', '녹음 중지'를 사용할 수 있습니다.</p></div></details>\n<details id=\"calendar_location\"><summary>캘린더 연동 · 위치 정보</summary><div class=\"topic-body\"><p>• 설정 → 녹음에서 캘린더 연동을 켜면, 녹음을 시작할 때 캘린더에 진행 중인 일정이 있으면 그 일정 이름이 파일 이름에 반영됩니다.<br>• 위치 정보를 켜면 녹음에 메타데이터로 좌표와 주소가 저장됩니다 (녹음 음성에는 포함되지 않습니다).<br>• 「.md에 위치 기록」을 켜면 클라우드로 보내는 문자 변환·요약 .md의 맨 위에 녹음 일시와 장소가 들어갑니다(기본은 꺼짐. 꺼져 있으면 위치는 기기 밖으로 나가지 않습니다).<br>• 둘 다 선택 사항입니다. 꺼 두어도 모든 기능을 사용할 수 있습니다.</p></div></details>\n<details id=\"background\"><summary>백그라운드 동작에 대해</summary><div class=\"topic-body\"><p>• 녹음은 화면이 잠기거나 다른 앱으로 전환해도 계속됩니다 (오디오 백그라운드 모드).<br>• 직접 실행한 문자 변환 / 요약 API 호출은 백그라운드에서도 최대 몇 분간 유지되지만, 오래 걸리는 작업(특히 Pro reasoning)은 앱을 전면에 두는 것이 안전합니다.<br>• 클라우드 업로드가 중간에 멈추면 iOS가 여유 있을 때 자동으로 재시도합니다.</p></div></details>\n<details id=\"privacy\"><summary>개인정보 및 데이터 처리</summary><div class=\"topic-body\"><p>• 녹음 음성은 기기와 사용자가 선택한 클라우드에만 저장됩니다.<br>• API 키 / 서비스 계정 JSON은 기기의 키체인에 암호화되어 저장되며, Voicloud Direct 서버(존재하지 않습니다)로는 전혀 전송되지 않습니다.<br>• 문자 변환 / 요약은 사용자가 선택한 AI 제공자(OpenAI / Google / Vertex)의 서버로 직접 전송됩니다. 각 사의 데이터 정책이 적용됩니다.<br>• 분석·광고·추적은 일절 하지 않습니다.</p></div></details>\n<details id=\"troubleshooting\"><summary>잘 되지 않을 때</summary><div class=\"topic-body\"><p>문자 변환이 이상하다 / 도중에 멈춘다:<br>• OpenAI Whisper-1은 무음 구간에 「시청해 주셔서 감사합니다」 같은 문구를 끼워 넣는 유명한 버릇이 있습니다. gpt-4o-transcribe로 전환하면 개선됩니다.<br>• Gemini 계열에서 시간이 부정확: 설정 → 문자 변환 프롬프트를 직접 바꾸지 않았다면 최신 버전(프리셋 「표준」)으로 되돌려 주세요.</p>\n<p>클라우드에 업로드되지 않는다:<br>• 설정에서 해당 클라우드가 「연결됨」인지 확인.<br>• OAuth 토큰이 만료되었을 수 있으니 한 번 연결 해제 → 다시 연결.</p>\n<p>동작 버튼이 반응하지 않을 때:<br>・iOS 설정 &gt; 동작 버튼 &gt; 제어 항목에서 'Voicloud Direct Recording'이 선택되어 있는지 확인하세요.<br>・처음에는 마이크 권한을 허용해야 합니다. iOS 설정 → Voicloud Direct에서 「실시간 현황」도 켜 두세요.<br>・잠금 상태에서 눌렀는데 녹음이 시작되지 않으면 한 번 더 눌러 주세요.</p>\n<p>그래도 해결되지 않으면 아래 「문의하기」로 연락해 주세요.</p></div></details>", "relatedLinks": "관련 링크", "privacyLink": "개인정보 처리방침", "contact": "<div class=\"contact-box\"><h3>문의하기</h3><p>오류 신고·기능 요청·질문은 이메일로 보내주십시오. 평일 기준 1~3 영업일 이내에 답변드립니다.</p><p><a href=\"mailto:monma.free@gmail.com\">monma.free@gmail.com</a></p></div>"},
    "zh-Hans": {"title": "Voicloud Direct — 帮助 / 支持", "heading": "帮助 / 支持", "tagline": "常见问题与故障排查", "topics": "<details id=\"flow\"><summary>基本用法</summary><div class=\"topic-body\"><p>iPhone 保持锁定也能录音；停止后，音频和转写会自动送到你自己的云端。</p>\n<p>首次设置（只需一次）<br>1. 在 App 的 设置 →“云端同步”中，登录要保存到的云端（iCloud Drive 无需登录）。<br>2. 把 Voicloud Direct 的录音指定给操作按钮（iPhone 15 Pro 及以上；步骤见下方的“Action Button 与 Live Activity”）。同一个控制项也可以放到控制中心或锁定屏幕。<br>3. 如果希望转写也自动完成，请在 设置 →“AI 转录 (BYOK)”中填入 API 密钥，并在 设置 →“自动处理”中打开“停止后自动转写”。</p>\n<p>日常使用<br>1. 在锁定屏幕上直接按操作按钮开始录音。锁定屏幕和灵动岛会显示已录时长。<br>2. 再按一次停止。<br>3. 录音会自动上传到已连接的云端。如果打开了自动转写，转写（和摘要）的 .md 文件也会送到同一个云端，不需要打开 App。</p>\n<p>也可以打开 App，用主屏幕上的录音按钮录音。轻点一条录音即可打开详情页面，使用播放、转写、摘要和“发送到 AI”。</p></div></details>\n<details id=\"microphone\"><summary>使用蓝牙 / AirPods 麦克风录音</summary><div class=\"topic-body\"><p>在 设置 → 录音 → 麦克风 中选择。</p>\n<p>• 自动（优先蓝牙）：使用已连接的蓝牙麦克风。<br>• iPhone 麦克风：始终使用内置麦克风。</p>\n<p>录音界面会显示当前正在使用的麦克风。</p>\n<p>⚠️ 蓝牙麦克风走的是通话链路，音质低于内置麦克风，转写准确率也可能下降。若以音质为先，请选择“iPhone 麦克风”。</p>\n<p>录音中蓝牙断开时，应用会自动切换到 iPhone 麦克风并继续录音（仍保存为一个文件）。录音中途连接耳机时同样会切换。</p>\n<p>若在此次更新前就已有录音，为避免更新后录音音质悄悄改变，默认值为“iPhone 麦克风”。</p></div></details>\n<details id=\"cloud\"><summary>连接云端</summary><div class=\"topic-body\"><p>支持 5 种云端：iCloud Drive / Google Drive / Dropbox / OneDrive / Box。</p>\n<p>• 在 设置 → 云同步 中点按要连接的服务并登录。<br>• 每条录音会自动上传到所有已连接的云端（新录音若遇到同名文件，会顺延编号后上传；重新上传时覆盖同名文件，历史记录由各服务保留）。<br>• iCloud Drive 无需登录，只要在 iOS 中开启 iCloud Drive 即可自动使用。如需在应用内“断开”，可在云同步部分关闭。<br>• 录音后再添加云端时，详情页的“云同步”部分会出现“同步”按钮，可用于补传。<br>• 即使已同步到全部云端，也可以用“重新上传”按钮强制上传（云端会新增一个版本）。</p></div></details>\n<details id=\"ai_send\"><summary>通过 Share Sheet 将音频发送给 AI</summary><div class=\"topic-body\"><p>在详情页点按“发送给 AI”，会打开 iOS 的共享表单。</p>\n<p>若已安装 NotebookLM，可直接导入音频文件。Gemini 和 ChatGPT 有时不接收共享的音频文件，这时建议通过“文件”应用打开云端文件夹（已自动同步，能立即找到同一文件）。</p>\n<p>提示：在共享表单中点按“编辑”，把 NotebookLM 加入“个人收藏”，它就会一直显示在最前面。</p></div></details>\n<details id=\"byok\"><summary>BYOK 转录（使用 API Key）</summary><div class=\"topic-body\"><p>使用你自己获取的 API 密钥，直接在应用内转写。</p>\n<p>支持的服务商：<br>• OpenAI（whisper-1 / gpt-4o-transcribe 等，不支持说话人分离）<br>• Gemini AI Studio（有免费额度，支持说话人分离）<br>• Vertex AI（Google Cloud 服务账号，支持说话人分离）</p>\n<p>在 设置 → AI 转写 中选择服务商并粘贴 API 密钥。密钥加密保存在设备的钥匙串中，不会发送到 Voicloud Direct 的服务器（本来就没有服务器）。</p>\n<p>如需说话人分离，请选择 Gemini 系列。OpenAI 转写准确，但不输出说话人标签。</p></div></details>\n<details id=\"auto\"><summary>自动转写与摘要</summary><div class=\"topic-body\"><p>在“设置 → 自动处理”中打开“停止后自动转写”，停止录音后，即使不打开应用，也会生成转写并把 .md 上传到云端。再打开“接着生成摘要”，摘要的 .md 也会上传。</p>\n<p>从锁定屏幕开始并停止的录音同样适用。AI 请求和云端上传由 iOS 接手继续，应用可以保持关闭。何时进行由 iOS 决定，通常几分钟内送达，视电量和网络情况可能更久。</p>\n<p>打开“仅在 Wi‑Fi 下上传”后，使用蜂窝数据时会暂停上传和 AI 处理，连上 Wi‑Fi 后继续。</p>\n<p>需要 AI 转写的 API 密钥，并同意把数据发送给外部 AI。</p></div></details>\n<details id=\"summary\"><summary>摘要与摘要提示词</summary><div class=\"topic-body\"><p>已转写的录音还可以用同一服务商生成总结。</p>\n<p>在 设置 → 总结提示词 中，可从预设中选择总结风格或自行编写（标准 / 会议纪要 / 闲聊 / 访谈 / 备忘）。</p>\n<p>OpenAI 的转写与总结使用完全不同的模型系列，因此有单独指定总结模型的栏位（如 gpt-4o-mini 或 gpt-5）。</p>\n<p>Pro / 推理系列（如 o3-pro / gpt-5.5-pro）推理时间更长，但质量更高。</p></div></details>\n<details id=\"diarization\"><summary>说话人分离技巧</summary><div class=\"topic-body\"><p>基于 Gemini 的说话人分离容易混淆声音相近的人，例如同性别、同年龄段的说话人。</p>\n<p>对策：<br>• 在详情页将“说话人数”从“自动”改为实际人数（如 4 人），可强制按该人数划分。<br>• 发现混淆时，可在 设置 → 转写提示词 中添加自己的线索（口头禅、口音、身份等）。<br>• 将转写模型换为 Pro 系列（如 gemini-2.5-pro）能处理比 Flash 更细的声音特征，通常更准确（但耗时 3–5 倍）。</p>\n<p>OpenAI Whisper / gpt-4o-transcribe 本身无法分离说话人。如需说话人标签，请选择 Gemini / Vertex。</p></div></details>\n<details id=\"playback\"><summary>播放・进度・速度</summary><div class=\"topic-body\"><p>• 点按或拖动波形即可跳到该位置并播放。<br>• 点按左侧的“1x”可按 1x → 1.5x → 2x → 0.5x 切换播放速度。<br>• 也可以使用后退 / 前进 10 秒按钮。<br>• 滚动浏览转写或总结时，波形和播放时间会固定在屏幕顶部。</p></div></details>\n<details id=\"edit\"><summary>剪切・静音・撤销</summary><div class=\"topic-body\"><p>在详情页面的“修剪”中，可以剪切录音的一部分，或将其静音。</p>\n<p>• 剪切：只保留所选范围。<br>• 静音：消除所选范围的声音。录音长度不变。转写中对应的部分也会删除，如有摘要则重新生成。<br>• 用两端的黄色手柄选择范围。拖动框上方的手柄，可以在不改变长度的情况下移动整个范围（“长度”下方的 −1s / +1s 按钮也可以）。<br>• 编辑页面打开期间，不会把该录音发送到云端。关闭后自动恢复发送。编辑后会重新发送编辑后的音频。<br>• 编辑前的音频会在设备上保存 3 天，可通过详情页面的“撤销编辑”恢复（最近 3 次）。转写和摘要也会恢复，并把原始音频重新发送到云端。<br>• 想立即删除时，请使用“立即删除编辑前的音频”。删除后无法撤销。<br>• 编辑前的音频只保存在设备内，不会发送到云端。但在编辑之前已经上传完成的音频，可能会留在云服务的版本历史中。</p></div></details>\n<details id=\"action_button\"><summary>Action Button 与 Live Activity（iPhone 15 Pro 及以上）</summary><div class=\"topic-body\"><p>在 iPhone 15 Pro 及更新机型上，可以用侧面的操作按钮开始录音。在“设置 &gt; 操作按钮 &gt; 控制”中选择“Voicloud Direct Recording”，之后按一下按钮即可开始或停止录音。iPhone 锁定时也能开始录音。</p>\n<p>录音时，灵动岛和锁定屏幕上会显示红色标记和已录时长。</p>\n<p>锁定时开始的录音，如果中途麦克风发生变化（例如 AirPods 切换到其他设备），会保存到该时刻并停止。</p>\n<p>也可以通过 Siri 快捷指令使用“切换录音”“开始录音”“停止录音”。</p></div></details>\n<details id=\"calendar_location\"><summary>日历联动・位置信息</summary><div class=\"topic-body\"><p>• 在 设置 → 录音 中开启日历联动后，开始录音时若日历中有进行中的日程，其名称会用作文件名。<br>• 开启位置信息后，坐标和地址会作为元数据与录音一起保存（不会嵌入录音音频）。<br>• 开启“在 .md 中写入位置”后，发送到云端的转写 / 总结 .md 开头会加入录音时间和地点（默认关闭；关闭时位置不会离开设备）。<br>• 两者均为可选。关闭后所有功能照常可用。</p></div></details>\n<details id=\"background\"><summary>关于后台运行</summary><div class=\"topic-body\"><p>• 锁屏或切换到其他应用时，录音仍会继续（音频后台模式）。<br>• 手动发起的转写 / 总结 API 调用可在后台保持数分钟，但耗时较长的任务（尤其是 Pro 推理模型）最好让应用保持在前台。<br>• 若云端上传中途停止，iOS 会在空闲时自动重试。</p></div></details>\n<details id=\"privacy\"><summary>隐私与数据处理</summary><div class=\"topic-body\"><p>• 录音仅保存在你的设备和你选择的云端。<br>• API 密钥 / 服务账号 JSON 加密保存在设备的钥匙串中，绝不会发送到 Voicloud Direct 的服务器（根本不存在）。<br>• 转写和总结会直接发送到你选择的 AI 服务商（OpenAI / Google / Vertex），适用各服务商的数据政策。<br>• 不进行任何分析、广告或跟踪。</p></div></details>\n<details id=\"troubleshooting\"><summary>遇到问题时</summary><div class=\"topic-body\"><p>转写结果异常 / 中途停止：<br>• OpenAI Whisper-1 有在静音段插入“感谢观看”之类语句的已知毛病，切换到 gpt-4o-transcribe 即可改善。<br>• Gemini 系列时间戳不准：如未自定义 设置 → 转写提示词，请恢复为最新版本（预设“标准”）。</p>\n<p>没有上传到云端：<br>• 在设置中确认该云端显示为“已连接”。<br>• OAuth 令牌可能已过期，请断开后重新连接一次。</p>\n<p>操作按钮没有反应：<br>・请确认在 iOS“设置 &gt; 操作按钮 &gt; 控制”中选择了“Voicloud Direct Recording”。<br>・首次使用时需要允许麦克风权限。另请在 iOS 设置 → Voicloud Direct 中保持“实时活动”开启。<br>・锁定时按下后没有开始录音，请再按一次。</p>\n<p>如仍未解决，请通过下方“联系我们”与我们联系。</p></div></details>", "relatedLinks": "相关链接", "privacyLink": "隐私政策", "contact": "<div class=\"contact-box\"><h3>联系我们</h3><p>如有问题、功能请求或疑问，请发送邮件联系。工作日内将在 1-3 个工作日内回复。</p><p><a href=\"mailto:monma.free@gmail.com\">monma.free@gmail.com</a></p></div>"}
  };

  function getLang() {
    var p = new URLSearchParams(location.search).get('lang');
    if (p && i18n[p]) return p;
    var bl = (navigator.language || 'ja');
    if (bl.startsWith('zh')) return 'zh-Hans';
    var s = bl.slice(0,2);
    return i18n[s] ? s : 'ja';
  }

  function render(lang) {
    var d = i18n[lang];
    document.title = d.title;
    document.documentElement.lang = lang;
    history.replaceState({},'','?lang='+lang);
    var bar = document.getElementById('lang-bar');
    bar.innerHTML = LANGS.map(function(l) {
      return '<button class="lang-btn' + (l===lang?' active':'') + '" onclick="render(\'' + l + '\')">' + LABELS[l] + '</button>';
    }).join('');
    var privacyLang = '?lang=' + lang;
    document.getElementById('content').innerHTML =
      '<div class="page-header"><h1>' + d.heading + '</h1><p class="subtitle">' + d.tagline + '</p></div>' +
      d.topics +
      '<div class="related-links"><h3>' + d.relatedLinks + '</h3><div class="link-row"><a class="link-pill" href="voicloud-direct.html' + privacyLang + '">' + d.privacyLink + '</a></div></div>' +
      d.contact +
      '<div class="footer">&copy; 2026 mon neural</div>';
  }

  window.render = render;
  render(getLang());
})();
</script>
